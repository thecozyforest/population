name: Validate population dashboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "base.html"
      - "search-enhancements.js"
      - "legal-admin-aliases.json"
      - "guide-enhancements.js"
      - "trend-enhancements.js"
      - "fieldwork-enhancements.js"
      - "scripts/build_index.py"
      - "scripts/update_legal_aliases.py"
      - ".github/workflows/validate-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check enhancement JavaScript syntax
        run: |
          node --check search-enhancements.js
          node --check guide-enhancements.js
          node --check trend-enhancements.js
          node --check fieldwork-enhancements.js

      - name: Check required files and deployment integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          required = [
              Path("index.html"),
              Path("base.html"),
              Path("search-enhancements.js"),
              Path("legal-admin-aliases.json"),
              Path("guide-enhancements.js"),
              Path("trend-enhancements.js"),
              Path("fieldwork-enhancements.js"),
              Path("scripts/build_index.py"),
              Path("scripts/update_legal_aliases.py"),
          ]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty file: {path}")

          aliases = json.loads(Path("legal-admin-aliases.json").read_text(encoding="utf-8"))
          if not isinstance(aliases.get("aliases"), list):
              raise SystemExit("legal-admin-aliases.json has no aliases list")
          봉천 = next((item for item in aliases["aliases"] if item.get("legal") == "서울특별시 관악구 봉천동"), None)
          if not 봉천 or len(봉천.get("admins", [])) < 9:
              raise SystemExit("봉천동 administrative-dong mapping is missing or incomplete")

          index = Path("index.html").read_text(encoding="utf-8")
          loader_mode = 'src="./fieldwork-enhancements.js' in index

          if loader_mode:
              for token in (
                  "base.html",
                  "search-enhancements.js",
                  "guide-enhancements.js",
                  "trend-enhancements.js",
                  "fieldwork-enhancements.js",
                  "pako.min.js",
              ):
                  if token not in index:
                      raise SystemExit(f"Loader reference missing: {token}")
          else:
              for token in (
                  'id="dashboard"',
                  "function activateTab",
                  "window.__decodePopulation",
                  "pako.min.js",
                  "BOOTSTRAP_ALIASES",
                  "서울특별시 관악구 봉천동",
                  "검색 기준 안내",
                  "📈 변화 추이",
                  "ℹ️ 사용설명서",
                  "population-fieldwork-check-v2",
                  "체크 결과 복사",
              ):
                  if token not in index:
                      raise SystemExit(f"Single-file integration token missing: {token}")

          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", index, flags=re.S)
          nonempty = [script for script in scripts if script.strip()]
          if not nonempty:
              raise SystemExit("No inline JavaScript found in index.html")
          for number, script in enumerate(nonempty, start=1):
              Path(f"/tmp/index-script-{number}.js").write_text(script, encoding="utf-8")
          print(
              f"deployment_mode={'loader' if loader_mode else 'single-file'}; "
              f"scripts={len(nonempty)}; aliases={len(aliases['aliases'])}"
          )
          PY

          for file in /tmp/index-script-*.js; do
            node --check "$file"
          done
