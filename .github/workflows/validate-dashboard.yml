name: Validate population dashboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "base.html"
      - "source-db-enhancements.js"
      - "guide-enhancements.js"
      - "trend-enhancements.js"
      - "trend-source-bridge.js"
      - "fieldwork-enhancements.js"
      - "credit-enhancements.js"
      - "scripts/build_index.py"
      - ".github/workflows/validate-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check enhancement JavaScript syntax
        run: |
          node --check source-db-enhancements.js
          node --check guide-enhancements.js
          node --check trend-enhancements.js
          node --check trend-source-bridge.js
          node --check fieldwork-enhancements.js
          node --check credit-enhancements.js

      - name: Validate original population DB rows
        run: |
          python - <<'PY'
          import csv
          import io
          import re
          import urllib.request

          url = "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv"
          content = urllib.request.urlopen(url, timeout=180).read()
          text = None
          for encoding in ("utf-8-sig", "cp949", "euc-kr"):
              try:
                  text = content.decode(encoding)
                  break
              except UnicodeDecodeError:
                  pass
          if text is None:
              raise SystemExit("Population CSV encoding could not be decoded")
          rows = list(csv.reader(io.StringIO(text)))
          data = [row for row in rows[1:] if row and any(str(value).strip() for value in row)]
          codes = []
          for row_number, row in enumerate(data, start=2):
              match = re.search(r"\((\d{8,12})\)\s*$", row[0].strip())
              if not match:
                  raise SystemExit(f"Missing original region code at CSV row {row_number}: {row[0]!r}")
              codes.append(match.group(1))
          if len(codes) != len(set(codes)):
              raise SystemExit(f"Duplicate original codes: rows={len(codes)}, unique={len(set(codes))}")
          print(f"Original DB rows={len(data):,}; unique codes={len(set(codes)):,}")
          PY

      - name: Check required files and single-file integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          required = [
              Path("index.html"), Path("base.html"), Path("source-db-enhancements.js"),
              Path("guide-enhancements.js"), Path("trend-enhancements.js"),
              Path("trend-source-bridge.js"), Path("fieldwork-enhancements.js"),
              Path("credit-enhancements.js"), Path("scripts/build_index.py"),
          ]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty file: {path}")

          build = Path("scripts/build_index.py").read_text(encoding="utf-8")
          if "search-enhancements.js" in build or "legal-admin-aliases.json" in build:
              raise SystemExit("Legal-dong alias integration must not be included in the build")
          for token in ("source-db-enhancements.js", "trend-enhancements.js", "trend-source-bridge.js", "fieldwork-enhancements.js", "guide-enhancements.js", "credit-enhancements.js"):
              if token not in build:
                  raise SystemExit(f"Build integration missing: {token}")

          index = Path("index.html").read_text(encoding="utf-8")
          for token in (
              'id="dashboard"', "window.__decodePopulation", "sourceRowCount",
              "원본 DB 행정구역명 또는 코드 검색", "population-fieldwork-check-v3",
              "codeFrom(row[indexes.code])", "📈 변화 추이", "ℹ️ 사용설명서",
              'id = "creatorCredit"', "만든 사람 : 기경민(동덕여고)",
              "pointer-events:none", "color:var(--primary2)",
          ):
              if token not in index:
                  raise SystemExit(f"Single-file integration token missing: {token}")
          if "BOOTSTRAP_ALIASES" in index or "legal-admin-aliases.json" in index:
              raise SystemExit("Alias search code remains in the deployed index")

          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", index, flags=re.S)
          nonempty = [script for script in scripts if script.strip()]
          if not nonempty:
              raise SystemExit("No inline JavaScript found in index.html")
          for number, script in enumerate(nonempty, start=1):
              Path(f"/tmp/index-script-{number}.js").write_text(script, encoding="utf-8")
          print(f"single-file scripts={len(nonempty)}; exact source, code trends and creator credit integrated")
          PY

          for file in /tmp/index-script-*.js; do
            node --check "$file"
          done
