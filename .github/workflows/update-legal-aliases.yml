name: Update legal and administrative dong aliases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 20 * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_legal_aliases.py"
      - ".github/workflows/update-legal-aliases.yml"

permissions:
  contents: write

concurrency:
  group: update-legal-admin-aliases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Build nationwide legal-dong search dictionary
        run: python scripts/update_legal_aliases.py

      - name: Validate generated dictionary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("legal-admin-aliases.json").read_text(encoding="utf-8"))
          aliases = data.get("aliases", [])
          if data.get("scope") != "nationwide-official":
              raise SystemExit("scope is not nationwide-official")
          if len(aliases) < 1000:
              raise SystemExit(f"Too few legal areas: {len(aliases)}")
          mapping = {item["legal"]: item["admins"] for item in aliases}
          expected = {
              "서울특별시 관악구 봉천동": {
                  "서울특별시 관악구 보라매동",
                  "서울특별시 관악구 은천동",
                  "서울특별시 관악구 성현동",
                  "서울특별시 관악구 청림동",
                  "서울특별시 관악구 중앙동",
                  "서울특별시 관악구 행운동",
                  "서울특별시 관악구 청룡동",
                  "서울특별시 관악구 낙성대동",
                  "서울특별시 관악구 인헌동",
              }
          }
          for legal, admins in expected.items():
              actual = set(mapping.get(legal, []))
              missing = admins - actual
              if missing:
                  raise SystemExit(f"{legal} mapping is incomplete: {sorted(missing)}")
          print(f"Validated {len(aliases):,} legal-area aliases")
          PY

      - name: Commit dictionary when changed
        run: |
          if git diff --quiet -- legal-admin-aliases.json; then
            echo "legal-admin-aliases.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-admin-aliases.json
          git commit -m "Update nationwide legal-dong search dictionary"
          git push
