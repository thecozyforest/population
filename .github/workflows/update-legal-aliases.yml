name: Update legal and administrative dong aliases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/update_legal_aliases.py"
      - ".github/workflows/update-legal-aliases.yml"

permissions:
  contents: write

concurrency:
  group: update-legal-admin-aliases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl

      - name: Build period-aligned nationwide search dictionary
        run: python scripts/update_legal_aliases.py

      - name: Validate generated dictionary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("legal-admin-aliases.json").read_text(encoding="utf-8"))
          aliases = data.get("aliases", [])
          if data.get("scope") != "nationwide-official-code-matched":
              raise SystemExit("scope is not nationwide-official-code-matched")
          if len(aliases) < 10000:
              raise SystemExit(f"Too few legal areas: {len(aliases)}")
          if data.get("updated", "9999-99-99") > data.get("population_cutoff", "0000-00-00"):
              raise SystemExit("Official mapping date is later than the population data cutoff")

          coverage = data.get("coverage", {})
          official = coverage.get("official_admin_code_count", 0)
          matched = coverage.get("matched_admin_code_count", 0)
          unmatched = coverage.get("unmatched_admin_code_count", 0)
          if not official or matched + unmatched != official:
              raise SystemExit("Coverage counts are inconsistent")

          mapping = {item["legal"]: set(item["admins"]) for item in aliases}
          expected = {
              "서울특별시 관악구 봉천동": {
                  "서울특별시 관악구 보라매동",
                  "서울특별시 관악구 은천동",
                  "서울특별시 관악구 성현동",
                  "서울특별시 관악구 청림동",
                  "서울특별시 관악구 중앙동",
                  "서울특별시 관악구 행운동",
                  "서울특별시 관악구 청룡동",
                  "서울특별시 관악구 낙성대동",
                  "서울특별시 관악구 인헌동",
              },
              "서울특별시 서초구 방배동": {
                  "서울특별시 서초구 서초3동",
                  "서울특별시 서초구 방배본동",
                  "서울특별시 서초구 방배1동",
                  "서울특별시 서초구 방배2동",
                  "서울특별시 서초구 방배3동",
                  "서울특별시 서초구 방배4동",
              },
              "서울특별시 관악구 신림동": {
                  "서울특별시 관악구 신림동",
                  "서울특별시 관악구 신사동",
                  "서울특별시 관악구 조원동",
                  "서울특별시 관악구 서원동",
                  "서울특별시 관악구 신원동",
                  "서울특별시 관악구 미성동",
                  "서울특별시 관악구 난곡동",
                  "서울특별시 관악구 난향동",
                  "서울특별시 관악구 삼성동",
                  "서울특별시 관악구 서림동",
                  "서울특별시 관악구 대학동",
              },
          }
          for legal, admins in expected.items():
              actual = mapping.get(legal, set())
              missing = admins - actual
              if missing:
                  raise SystemExit(f"{legal} mapping is incomplete: {sorted(missing)}")

          print(
              f"Validated {len(aliases):,} aliases; population={data.get('population_period')}; "
              f"official={data.get('updated')}; matched={matched:,}/{official:,}; unmatched={unmatched:,}"
          )
          PY

      - name: Commit dictionary when changed
        run: |
          if git diff --quiet -- legal-admin-aliases.json; then
            echo "legal-admin-aliases.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-admin-aliases.json
          git commit -m "Update period-aligned legal dong search dictionary"
          git pull --rebase origin main
          git push
