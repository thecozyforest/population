name: Audit exact source DB integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "source-db-enhancements.js"
      - "scripts/audit_source_db_integration.py"
      - ".github/workflows/audit-source-db.yml"

permissions:
  contents: write

concurrency:
  group: audit-exact-source-db
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit source rows and deployed integration
        id: audit
        continue-on-error: true
        run: python scripts/audit_source_db_integration.py

      - name: Commit audit report
        if: always()
        run: |
          if [ ! -f source-db-validation.json ]; then
            echo "Audit report was not created."
            exit 1
          fi
          if git diff --quiet -- source-db-validation.json; then
            echo "Audit report is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source-db-validation.json
            git commit -m "Update exact source DB validation report"
            git pull --rebase origin main
            git push
          fi

      - name: Fail when audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
