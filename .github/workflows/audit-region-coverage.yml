name: Audit nationwide region coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_region_coverage.py"
      - "scripts/update_legal_aliases.py"
      - ".github/workflows/audit-region-coverage.yml"

permissions:
  contents: write

concurrency:
  group: audit-region-coverage
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl beautifulsoup4

      - name: Build nationwide coverage report
        run: python scripts/audit_region_coverage.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region-coverage-report.json
          if git diff --cached --quiet; then
            echo "Coverage report is unchanged."
            exit 0
          fi
          git commit -m "Update nationwide region coverage audit"
          git push
