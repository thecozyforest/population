name: Validate legal dong search dictionary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "legal-admin-aliases.json"
      - "scripts/validate_search_dictionary.py"
      - ".github/workflows/validate-search-dictionary.yml"

permissions:
  contents: write

concurrency:
  group: validate-search-dictionary
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate every alias against current population rows
        run: python scripts/validate_search_dictionary.py

      - name: Commit validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region-search-validation.json
          if git diff --cached --quiet; then
            echo "Search validation report is unchanged."
            exit 0
          fi
          git commit -m "Update legal dong search validation report"
          git pull --rebase origin main
          git push
