name: Build single-file dashboard

on:
  push:
    branches: [main]
    paths:
      - "base.html"
      - "guide-enhancements.js"
      - "trend-enhancements.js"
      - "scripts/build_index.py"
      - ".github/workflows/build-single-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index.html
        run: python scripts/build_index.py

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build single-file population dashboard"
          git push
