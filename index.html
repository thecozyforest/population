<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지역별 인구 검색 + 인구 피라미드</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: #f4f6fa;
      color: #172033;
      font-family:
        Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
    }

    .container {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 40px);
      letter-spacing: -0.04em;
    }

    .description {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .panel {
      padding: 24px;
      border: 1px solid #e4e7ec;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(16, 24, 40, 0.07);
    }

    .search-form {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      height: 52px;
      padding: 0 16px;
      border: 1px solid #cfd4dc;
      border-radius: 12px;
      outline: none;
      font: inherit;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    .search-input:focus {
      border-color: #4169e1;
      box-shadow: 0 0 0 4px rgba(65, 105, 225, 0.12);
    }

    .search-button {
      height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #3157d5;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .search-button:hover {
      background: #2748b8;
    }

    .search-button:disabled,
    .search-input:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 24px;
      margin: 14px 2px 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .status.error {
      color: #c43232;
    }

    .result {
      margin-top: 24px;
    }

    .result[hidden] {
      display: none;
    }

    .region-title {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .period {
      margin: 0 0 16px;
      color: #667085;
      font-size: 14px;
    }

    .population-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .population-card {
      padding: 20px 16px;
      border-radius: 16px;
      background: #f7f8fb;
      text-align: center;
    }

    .population-card.total {
      background: #edf2ff;
    }

    .population-label {
      display: block;
      margin-bottom: 9px;
      color: #667085;
      font-size: 14px;
      font-weight: 700;
    }

    .population-value {
      display: block;
      font-size: clamp(21px, 4vw, 30px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .population-unit {
      margin-left: 2px;
      color: #667085;
      font-size: 14px;
      font-weight: 500;
    }

    .chart-card {
      padding: 18px 18px 8px;
      border: 1px solid #e9edf5;
      border-radius: 18px;
      background: linear-gradient(180deg, #fbfcff 0%, #f7f9fc 100%);
    }

    .chart-title {
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .chart-description {
      margin: 0 0 8px;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    #pyramidChart {
      width: 100%;
      height: 760px;
    }

    @media (max-width: 768px) {
      body {
        padding: 24px 14px;
      }

      .panel {
        padding: 18px;
      }

      .search-form {
        flex-direction: column;
      }

      .search-button {
        width: 100%;
      }

      .population-grid {
        grid-template-columns: 1fr;
      }

      #pyramidChart {
        height: 860px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>지역별 인구 검색</h1>
      <p class="description">
        행정구역을 검색해 총인구·남녀 인구와 인구 피라미드를 확인하세요.
      </p>
    </header>

    <section class="panel">
      <form id="searchForm" class="search-form">
        <label for="regionInput" hidden>행정구역</label>
        <input
          id="regionInput"
          class="search-input"
          type="text"
          list="regionList"
          value="서울특별시 서초구 방배동"
          placeholder="예: 서울특별시 종로구"
          autocomplete="off"
          disabled
        />
        <datalist id="regionList"></datalist>
        <button id="searchButton" class="search-button" type="submit" disabled>검색</button>
      </form>

      <p id="status" class="status" role="status">
        인구 데이터를 불러오는 중입니다.
      </p>

      <section id="result" class="result" hidden>
        <h2 id="regionTitle" class="region-title"></h2>
        <p id="period" class="period"></p>

        <div class="population-grid">
          <article class="population-card total">
            <span class="population-label">총인구</span>
            <strong class="population-value">
              <span id="totalPopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>

          <article class="population-card">
            <span class="population-label">남자</span>
            <strong class="population-value">
              <span id="malePopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>

          <article class="population-card">
            <span class="population-label">여자</span>
            <strong class="population-value">
              <span id="femalePopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>
        </div>

        <section class="chart-card">
          <h3 class="chart-title">인구 피라미드</h3>
          <p class="chart-description">
            0세부터 100세까지의 1세 단위 인구입니다. 남자는 왼쪽, 여자는 오른쪽에 표시됩니다.
          </p>
          <div id="pyramidChart"></div>
        </section>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    const CSV_URL = "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv";
    const DEFAULT_REGION = "서울특별시 서초구 방배동";

    const searchForm = document.getElementById("searchForm");
    const regionInput = document.getElementById("regionInput");
    const regionList = document.getElementById("regionList");
    const searchButton = document.getElementById("searchButton");
    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");
    const regionTitle = document.getElementById("regionTitle");
    const periodElement = document.getElementById("period");
    const totalPopulation = document.getElementById("totalPopulation");
    const malePopulation = document.getElementById("malePopulation");
    const femalePopulation = document.getElementById("femalePopulation");
    const pyramidChart = document.getElementById("pyramidChart");

    const numberFormatter = new Intl.NumberFormat("ko-KR");
    const regionMap = new Map();
    let regionNames = [];
    let dataPeriod = "";

    function parseCSV(text, onRow) {
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];

        if (insideQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i += 1;
            } else {
              insideQuotes = false;
            }
          } else {
            field += ch;
          }
          continue;
        }

        if (ch === '"') {
          insideQuotes = true;
        } else if (ch === ",") {
          row.push(field);
          field = "";
        } else if (ch === "\n") {
          row.push(field);
          onRow(row);
          row = [];
          field = "";
        } else if (ch !== "\r") {
          field += ch;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        onRow(row);
      }
    }

    function cleanRegionName(value) {
      return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\s*\(\s*\d+\s*\)\s*$/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeRegionName(value) {
      return cleanRegionName(value)
        .normalize("NFC")
        .replace(/^서울시(?=\s|$)/, "서울특별시")
        .replace(/^부산시(?=\s|$)/, "부산광역시")
        .replace(/^대구시(?=\s|$)/, "대구광역시")
        .replace(/^인천시(?=\s|$)/, "인천광역시")
        .replace(/^광주시(?=\s|$)/, "광주광역시")
        .replace(/^대전시(?=\s|$)/, "대전광역시")
        .replace(/^울산시(?=\s|$)/, "울산광역시")
        .replace(/^세종시(?=\s|$)/, "세종특별자치시")
        .replace(/^제주도(?=\s|$)/, "제주특별자치도");
    }

    function parsePopulationNumber(value) {
      const cleaned = String(value ?? "").replace(/,/g, "").trim();
      if (cleaned === "" || cleaned === "-") return 0;
      const num = Number(cleaned);
      return Number.isFinite(num) ? num : 0;
    }

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function findSimilarRegions(query) {
      const normalizedQuery = normalizeRegionName(query);
      const words = normalizedQuery.split(" ").filter(Boolean);
      const lastWord = words.at(-1) ?? "";
      const parentName = words.slice(0, -1).join(" ");
      const baseName = lastWord.replace(/[읍면동리]$/, "");

      return regionNames
        .filter((name) => {
          const normalizedName = normalizeRegionName(name);

          if (normalizedName.includes(normalizedQuery)) return true;

          if (!parentName || baseName.length < 2) return false;

          const nameWords = normalizedName.split(" ");
          const nameLastWord = nameWords.at(-1) ?? "";
          const nameParent = nameWords.slice(0, -1).join(" ");

          return nameParent === parentName && nameLastWord.startsWith(baseName);
        })
        .slice(0, 5);
    }

    function buildTickValues(maxValue) {
      if (maxValue <= 0) return [-1, 0, 1];

      const roughStep = maxValue / 4;
      const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
      const normalized = roughStep / magnitude;

      let step;
      if (normalized <= 1) step = 1 * magnitude;
      else if (normalized <= 2) step = 2 * magnitude;
      else if (normalized <= 5) step = 5 * magnitude;
      else step = 10 * magnitude;

      const limit = Math.ceil(maxValue / step) * step;
      const ticks = [];
      for (let v = -limit; v <= limit; v += step) {
        ticks.push(v);
      }
      return ticks;
    }

    function renderPyramid(population) {
      const ages = [];
      const maleValues = [];
      const femaleValues = [];

      for (let age = 100; age >= 0; age -= 1) {
        ages.push(`${age}세`);
        maleValues.push(-(population.ageMale[age] || 0));
        femaleValues.push(population.ageFemale[age] || 0);
      }

      const maxValue = Math.max(
        ...population.ageMale,
        ...population.ageFemale,
        1
      );

      const tickvals = buildTickValues(maxValue);
      const ticktext = tickvals.map((v) => numberFormatter.format(Math.abs(v)));

      const traceMale = {
        type: "bar",
        orientation: "h",
        name: "남자",
        y: ages,
        x: maleValues,
        marker: {
          color: "rgba(59,130,246,0.85)"
        },
        hovertemplate: "남자 %{y}: %{customdata}명<extra></extra>",
        customdata: maleValues.map((v) => numberFormatter.format(Math.abs(v)))
      };

      const traceFemale = {
        type: "bar",
        orientation: "h",
        name: "여자",
        y: ages,
        x: femaleValues,
        marker: {
          color: "rgba(244,114,182,0.85)"
        },
        hovertemplate: "여자 %{y}: %{x:,}명<extra></extra>"
      };

      const layout = {
        barmode: "relative",
        bargap: 0.08,
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        margin: { t: 20, r: 20, b: 40, l: 70 },
        legend: {
          orientation: "h",
          x: 0.5,
          xanchor: "center",
          y: 1.08,
          yanchor: "bottom"
        },
        xaxis: {
          title: { text: "인구(명)" },
          zeroline: true,
          zerolinecolor: "rgba(148,163,184,0.6)",
          gridcolor: "rgba(148,163,184,0.18)",
          tickvals,
          ticktext,
          tickfont: { size: 12 },
          automargin: true
        },
        yaxis: {
          title: { text: "나이" },
          automargin: true,
          categoryorder: "array",
          categoryarray: ages,
          tickfont: { size: 10 }
        },
        font: {
          family: 'Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
          color: "#172033"
        }
      };

      Plotly.newPlot(
        pyramidChart,
        [traceMale, traceFemale],
        layout,
        {
          displayModeBar: false,
          responsive: true
        }
      );
    }

    function showRegion(query) {
      const normalizedQuery = normalizeRegionName(query);

      if (!normalizedQuery) {
        resultElement.hidden = true;
        setStatus("검색할 지역을 입력해 주세요.", true);
        return;
      }

      const population = regionMap.get(normalizedQuery);

      if (!population) {
        resultElement.hidden = true;
        Plotly.purge(pyramidChart);

        const suggestions = findSimilarRegions(normalizedQuery);
        if (suggestions.length > 0) {
          setStatus(
            `일치하는 지역이 없습니다. 다음 지역을 확인해 보세요: ${suggestions.join(", ")}`,
            true
          );
        } else {
          setStatus(
            "입력한 지역을 찾을 수 없습니다. 목록에서 정확한 행정구역을 선택해 주세요.",
            true
          );
        }
        return;
      }

      regionInput.value = population.name;
      regionTitle.textContent = population.name;
      periodElement.textContent = dataPeriod
        ? `${dataPeriod} 주민등록 인구 기준`
        : "주민등록 인구 기준";

      totalPopulation.textContent = numberFormatter.format(population.total);
      malePopulation.textContent = numberFormatter.format(population.male);
      femalePopulation.textContent = numberFormatter.format(population.female);

      resultElement.hidden = false;
      setStatus(`${population.name}의 인구 정보를 표시했습니다.`);
      renderPyramid(population);
    }

    function createRegionOptions() {
      const fragment = document.createDocumentFragment();

      for (const name of regionNames) {
        const option = document.createElement("option");
        option.value = name;
        fragment.appendChild(option);
      }

      regionList.replaceChildren(fragment);
    }

    async function loadPopulationData() {
      try {
        const response = await fetch(CSV_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`CSV 요청 실패: HTTP ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const csvText = new TextDecoder("euc-kr").decode(arrayBuffer);

        let headers = null;
        const maleAgeColumns = [];
        const femaleAgeColumns = [];

        parseCSV(csvText, (row) => {
          if (!headers) {
            headers = row.map((header, index) => {
              const cleaned = String(header ?? "").trim();
              return index === 0 ? cleaned.replace(/^\uFEFF/, "") : cleaned;
            });

            headers.forEach((header, index) => {
              const maleMatch = header.match(/^(\d{4}년\d{1,2}월)_남_(\d+)세$/);
              const femaleMatch = header.match(/^(\d{4}년\d{1,2}월)_여_(\d+)세$/);
              const male100PlusMatch = header.match(/^(\d{4}년\d{1,2}월)_남_100세\s*이상$/);
              const female100PlusMatch = header.match(/^(\d{4}년\d{1,2}월)_여_100세\s*이상$/);

              if (!dataPeriod) {
                const periodMatch = header.match(/^(\d{4}년\d{1,2}월)_/);
                if (periodMatch) dataPeriod = periodMatch[1];
              }

              if (maleMatch) {
                const age = Number(maleMatch[2]);
                if (age >= 0 && age <= 100) maleAgeColumns.push({ index, age });
              } else if (femaleMatch) {
                const age = Number(femaleMatch[2]);
                if (age >= 0 && age <= 100) femaleAgeColumns.push({ index, age });
              } else if (male100PlusMatch) {
                maleAgeColumns.push({ index, age: 100 });
              } else if (female100PlusMatch) {
                femaleAgeColumns.push({ index, age: 100 });
              }
            });

            return;
          }

          if (!row.length || row.every((value) => String(value).trim() === "")) {
            return;
          }

          const name = cleanRegionName(row[0]);
          if (!name) return;

          const ageMale = Array(101).fill(0);
          const ageFemale = Array(101).fill(0);

          for (const col of maleAgeColumns) {
            ageMale[col.age] += parsePopulationNumber(row[col.index]);
          }

          for (const col of femaleAgeColumns) {
            ageFemale[col.age] += parsePopulationNumber(row[col.index]);
          }

          const male = ageMale.reduce((sum, v) => sum + v, 0);
          const female = ageFemale.reduce((sum, v) => sum + v, 0);

          regionMap.set(normalizeRegionName(name), {
            name,
            male,
            female,
            total: male + female,
            ageMale,
            ageFemale
          });
        });

        if (!headers) {
          throw new Error("CSV 헤더를 읽지 못했습니다.");
        }

        if (maleAgeColumns.length === 0 || femaleAgeColumns.length === 0) {
          throw new Error("남녀 연령별 인구 열을 찾지 못했습니다.");
        }

        regionNames = Array.from(regionMap.values())
          .map((item) => item.name)
          .sort((a, b) => a.localeCompare(b, "ko-KR"));

        createRegionOptions();

        regionInput.disabled = false;
        searchButton.disabled = false;
        regionInput.value = DEFAULT_REGION;

        setStatus(`${numberFormatter.format(regionNames.length)}개 행정구역을 불러왔습니다.`);
        showRegion(DEFAULT_REGION);
      } catch (error) {
        console.error(error);
        regionInput.disabled = true;
        searchButton.disabled = true;
        resultElement.hidden = true;
        Plotly.purge(pyramidChart);

        setStatus(
          "인구 데이터를 불러오지 못했습니다. 인터넷 연결이나 CSV 주소를 확인해 주세요.",
          true
        );
      }
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      showRegion(regionInput.value);
    });

    regionInput.addEventListener("change", () => {
      showRegion(regionInput.value);
    });

    loadPopulationData();
  </script>
</body>
</html>
