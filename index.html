<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>지역별 인구 검색 + 인구 피라미드</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: #f4f6fa;
      color: #172033;
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
    }

    .container {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 40px);
      letter-spacing: -0.04em;
    }

    .description {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .panel {
      padding: 24px;
      border: 1px solid #e4e7ec;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(16, 24, 40, 0.07);
    }

    .search-form {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      height: 52px;
      padding: 0 16px;
      border: 1px solid #cfd4dc;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
      font: inherit;
      font-size: 16px;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .search-button {
      height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #1d4ed8;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .search-button:hover {
      background: #1e40af;
    }

    .search-button:disabled,
    .search-input:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 24px;
      margin: 14px 2px 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .status.error {
      color: #c43232;
    }

    .result {
      margin-top: 24px;
    }

    .result[hidden] {
      display: none;
    }

    .region-title {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .period {
      margin: 0 0 16px;
      color: #667085;
      font-size: 14px;
    }

    .population-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .population-card {
      padding: 20px 16px;
      border-radius: 16px;
      background: #f7f8fb;
      text-align: center;
    }

    .population-card.total {
      background: #edf2ff;
    }

    .population-card.male {
      background: #eff6ff;
    }

    .population-card.female {
      background: #fff1f2;
    }

    .population-label {
      display: block;
      margin-bottom: 9px;
      color: #667085;
      font-size: 14px;
      font-weight: 700;
    }

    .population-value {
      display: block;
      font-size: clamp(21px, 4vw, 30px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .population-unit {
      margin-left: 2px;
      color: #667085;
      font-size: 14px;
      font-weight: 500;
    }

    .chart-card {
      padding: 20px 18px 10px;
      border: 1px solid #e3e8f0;
      border-radius: 18px;
      background: #f8fafc;
    }

    .chart-title {
      margin: 0 0 6px;
      font-size: 19px;
      letter-spacing: -0.02em;
    }

    .chart-description {
      margin: 0 0 8px;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    #pyramidChart {
      width: 100%;
      height: 520px;
    }

    @media (max-width: 768px) {
      body {
        padding: 24px 14px;
      }

      .panel {
        padding: 18px;
      }

      .search-form {
        flex-direction: column;
      }

      .search-button {
        width: 100%;
      }

      .population-grid {
        grid-template-columns: 1fr;
      }

      #pyramidChart {
        height: 580px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>지역별 인구 검색</h1>

      <p class="description">
        행정구역을 검색해 총인구·남녀 인구와 인구 피라미드를 확인하세요.
      </p>
    </header>

    <section class="panel">
      <form id="searchForm" class="search-form">
        <label for="regionInput" hidden>행정구역</label>

        <input
          id="regionInput"
          class="search-input"
          type="text"
          list="regionList"
          value="서울특별시 서초구 방배동"
          placeholder="예: 서울특별시 서초구 방배동"
          autocomplete="off"
          disabled
        />

        <datalist id="regionList"></datalist>

        <button
          id="searchButton"
          class="search-button"
          type="submit"
          disabled
        >
          검색
        </button>
      </form>

      <p id="status" class="status" role="status">
        인구 데이터를 불러오는 중입니다.
      </p>

      <section id="result" class="result" hidden>
        <h2 id="regionTitle" class="region-title"></h2>
        <p id="period" class="period"></p>

        <div class="population-grid">
          <article class="population-card total">
            <span class="population-label">총인구</span>

            <strong class="population-value">
              <span id="totalPopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>

          <article class="population-card male">
            <span class="population-label">남자</span>

            <strong class="population-value">
              <span id="malePopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>

          <article class="population-card female">
            <span class="population-label">여자</span>

            <strong class="population-value">
              <span id="femalePopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>
        </div>

        <section class="chart-card">
          <h3 class="chart-title">인구 피라미드</h3>

          <p class="chart-description">
            연령을 10세 단위로 묶었습니다. 남자는 왼쪽, 여자는 오른쪽입니다.
          </p>

          <div id="pyramidChart"></div>
        </section>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    const CSV_URL =
      "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv";

    const DEFAULT_REGION = "서울특별시 서초구 방배동";

    const MALE_COLOR = "#2563EB";
    const FEMALE_COLOR = "#E11D48";

    const searchForm = document.getElementById("searchForm");
    const regionInput = document.getElementById("regionInput");
    const regionList = document.getElementById("regionList");
    const searchButton = document.getElementById("searchButton");
    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");
    const regionTitle = document.getElementById("regionTitle");
    const periodElement = document.getElementById("period");
    const totalPopulation = document.getElementById("totalPopulation");
    const malePopulation = document.getElementById("malePopulation");
    const femalePopulation = document.getElementById("femalePopulation");
    const pyramidChart = document.getElementById("pyramidChart");

    const numberFormatter = new Intl.NumberFormat("ko-KR");

    const regionMap = new Map();

    let regionNames = [];
    let dataPeriod = "";

    function parseCSV(text, onRow) {
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const character = text[i];

        if (insideQuotes) {
          if (character === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i += 1;
            } else {
              insideQuotes = false;
            }
          } else {
            field += character;
          }

          continue;
        }

        if (character === '"') {
          insideQuotes = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field);
          onRow(row);

          row = [];
          field = "";
        } else if (character !== "\r") {
          field += character;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        onRow(row);
      }
    }

    function cleanRegionName(value) {
      return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\s*\(\s*\d+\s*\)\s*$/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeRegionName(value) {
      return cleanRegionName(value)
        .normalize("NFC")
        .replace(/^서울시(?=\s|$)/, "서울특별시")
        .replace(/^부산시(?=\s|$)/, "부산광역시")
        .replace(/^대구시(?=\s|$)/, "대구광역시")
        .replace(/^인천시(?=\s|$)/, "인천광역시")
        .replace(/^광주시(?=\s|$)/, "광주광역시")
        .replace(/^대전시(?=\s|$)/, "대전광역시")
        .replace(/^울산시(?=\s|$)/, "울산광역시")
        .replace(/^세종시(?=\s|$)/, "세종특별자치시")
        .replace(/^제주도(?=\s|$)/, "제주특별자치도");
    }

    function parsePopulationNumber(value) {
      const cleaned = String(value ?? "")
        .replace(/,/g, "")
        .trim();

      if (cleaned === "" || cleaned === "-") {
        return 0;
      }

      const number = Number(cleaned);

      return Number.isFinite(number) ? number : 0;
    }

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function findSimilarRegions(query) {
      const normalizedQuery = normalizeRegionName(query);
      const words = normalizedQuery.split(" ").filter(Boolean);
      const lastWord = words.at(-1) ?? "";
      const parentName = words.slice(0, -1).join(" ");
      const baseName = lastWord.replace(/[읍면동리]$/, "");

      return regionNames
        .filter((name) => {
          const normalizedName = normalizeRegionName(name);

          if (normalizedName.includes(normalizedQuery)) {
            return true;
          }

          if (!parentName || baseName.length < 2) {
            return false;
          }

          const nameWords = normalizedName.split(" ");
          const nameLastWord = nameWords.at(-1) ?? "";
          const nameParent = nameWords.slice(0, -1).join(" ");

          return (
            nameParent === parentName &&
            nameLastWord.startsWith(baseName)
          );
        })
        .slice(0, 5);
    }

    function createAgeGroups(ageValues) {
      const groups = [];

      for (let startAge = 0; startAge <= 90; startAge += 10) {
        let population = 0;

        for (
          let age = startAge;
          age <= startAge + 9;
          age += 1
        ) {
          population += ageValues[age] || 0;
        }

        groups.push(population);
      }

      groups.push(ageValues[100] || 0);

      return groups;
    }

    function buildTickValues(maxValue) {
      if (maxValue <= 0) {
        return [-1, 0, 1];
      }

      const roughStep = maxValue / 4;
      const magnitude = Math.pow(
        10,
        Math.floor(Math.log10(roughStep))
      );

      const normalized = roughStep / magnitude;

      let step;

      if (normalized <= 1) {
        step = magnitude;
      } else if (normalized <= 2) {
        step = 2 * magnitude;
      } else if (normalized <= 5) {
        step = 5 * magnitude;
      } else {
        step = 10 * magnitude;
      }

      const limit = Math.ceil(maxValue / step) * step;
      const tickValues = [];

      for (
        let value = -limit;
        value <= limit;
        value += step
      ) {
        tickValues.push(value);
      }

      return tickValues;
    }

    function renderPyramid(population) {
      const ageLabels = [
        "0~9세",
        "10~19세",
        "20~29세",
        "30~39세",
        "40~49세",
        "50~59세",
        "60~69세",
        "70~79세",
        "80~89세",
        "90~99세",
        "100세 이상"
      ];

      const groupedMale = createAgeGroups(population.ageMale);
      const groupedFemale = createAgeGroups(population.ageFemale);

      const maleValues = groupedMale.map(
        (value) => -value
      );

      const femaleValues = [...groupedFemale];

      const maxValue = Math.max(
        ...groupedMale,
        ...groupedFemale,
        1
      );

      const tickValues = buildTickValues(maxValue);

      const tickTexts = tickValues.map((value) =>
        numberFormatter.format(Math.abs(value))
      );

      const maleTrace = {
        type: "bar",
        orientation: "h",
        name: "남자",
        y: ageLabels,
        x: maleValues,

        marker: {
          color: MALE_COLOR,
          line: {
            color: "#1E40AF",
            width: 0.5
          }
        },

        customdata: groupedMale.map((value) =>
          numberFormatter.format(value)
        ),

        hovertemplate:
          "<b>%{y}</b><br>남자: %{customdata}명<extra></extra>"
      };

      const femaleTrace = {
        type: "bar",
        orientation: "h",
        name: "여자",
        y: ageLabels,
        x: femaleValues,

        marker: {
          color: FEMALE_COLOR,
          line: {
            color: "#9F1239",
            width: 0.5
          }
        },

        customdata: groupedFemale.map((value) =>
          numberFormatter.format(value)
        ),

        hovertemplate:
          "<b>%{y}</b><br>여자: %{customdata}명<extra></extra>"
      };

      const layout = {
        barmode: "relative",
        bargap: 0.16,

        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",

        margin: {
          t: 58,
          r: 24,
          b: 55,
          l: 85
        },

        legend: {
          orientation: "h",
          x: 0.5,
          xanchor: "center",
          y: 1.04,
          yanchor: "bottom",

          font: {
            size: 14
          }
        },

        xaxis: {
          title: {
            text: "인구(명)",
            standoff: 12
          },

          tickvals: tickValues,
          ticktext: tickTexts,

          zeroline: true,
          zerolinewidth: 1.5,
          zerolinecolor: "#64748B",

          gridcolor: "rgba(148,163,184,0.25)",
          gridwidth: 1,

          tickfont: {
            size: 12
          },

          automargin: true,
          fixedrange: true
        },

        yaxis: {
          title: {
            text: "연령",
            standoff: 10
          },

          categoryorder: "array",
          categoryarray: ageLabels,

          tickfont: {
            size: 13
          },

          automargin: true,
          fixedrange: true
        },

        font: {
          family:
            'Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
          color: "#172033"
        },

        hoverlabel: {
          bgcolor: "#ffffff",
          bordercolor: "#cbd5e1",
          font: {
            color: "#172033",
            size: 13
          }
        }
      };

      Plotly.react(
        pyramidChart,
        [maleTrace, femaleTrace],
        layout,
        {
          displayModeBar: false,
          responsive: true
        }
      );
    }

    function showRegion(query) {
      const normalizedQuery = normalizeRegionName(query);

      if (!normalizedQuery) {
        resultElement.hidden = true;
        setStatus("검색할 지역을 입력해 주세요.", true);
        return;
      }

      const population = regionMap.get(normalizedQuery);

      if (!population) {
        resultElement.hidden = true;

        if (window.Plotly) {
          Plotly.purge(pyramidChart);
        }

        const suggestions = findSimilarRegions(normalizedQuery);

        if (suggestions.length > 0) {
          setStatus(
            `일치하는 지역이 없습니다. 다음 지역을 확인해 보세요: ${suggestions.join(", ")}`,
            true
          );
        } else {
          setStatus(
            "입력한 지역을 찾을 수 없습니다. 목록에서 정확한 행정구역을 선택해 주세요.",
            true
          );
        }

        return;
      }

      regionInput.value = population.name;
      regionTitle.textContent = population.name;

      periodElement.textContent = dataPeriod
        ? `${dataPeriod} 주민등록 인구 기준`
        : "주민등록 인구 기준";

      totalPopulation.textContent =
        numberFormatter.format(population.total);

      malePopulation.textContent =
        numberFormatter.format(population.male);

      femalePopulation.textContent =
        numberFormatter.format(population.female);

      resultElement.hidden = false;

      setStatus(
        `${population.name}의 인구 정보를 표시했습니다.`
      );

      renderPyramid(population);
    }

    function createRegionOptions() {
      const fragment = document.createDocumentFragment();

      for (const name of regionNames) {
        const option = document.createElement("option");
        option.value = name;

        fragment.appendChild(option);
      }

      regionList.replaceChildren(fragment);
    }

    async function loadPopulationData() {
      try {
        const response = await fetch(CSV_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `CSV 요청 실패: HTTP ${response.status}`
          );
        }

        const arrayBuffer = await response.arrayBuffer();

        const csvText = new TextDecoder(
          "euc-kr"
        ).decode(arrayBuffer);

        let headers = null;

        const maleAgeColumns = [];
        const femaleAgeColumns = [];

        parseCSV(csvText, (row) => {
          if (!headers) {
            headers = row.map((header, index) => {
              const cleanedHeader =
                String(header ?? "").trim();

              return index === 0
                ? cleanedHeader.replace(/^\uFEFF/, "")
                : cleanedHeader;
            });

            headers.forEach((header, index) => {
              const maleMatch = header.match(
                /^(\d{4}년\d{1,2}월)_남_(\d+)세$/
              );

              const femaleMatch = header.match(
                /^(\d{4}년\d{1,2}월)_여_(\d+)세$/
              );

              const male100PlusMatch = header.match(
                /^(\d{4}년\d{1,2}월)_남_100세\s*이상$/
              );

              const female100PlusMatch = header.match(
                /^(\d{4}년\d{1,2}월)_여_100세\s*이상$/
              );

              if (!dataPeriod) {
                const periodMatch = header.match(
                  /^(\d{4}년\d{1,2}월)_/
                );

                if (periodMatch) {
                  dataPeriod = periodMatch[1];
                }
              }

              if (maleMatch) {
                const age = Number(maleMatch[2]);

                if (age >= 0 && age <= 100) {
                  maleAgeColumns.push({
                    index,
                    age
                  });
                }
              } else if (femaleMatch) {
                const age = Number(femaleMatch[2]);

                if (age >= 0 && age <= 100) {
                  femaleAgeColumns.push({
                    index,
                    age
                  });
                }
              } else if (male100PlusMatch) {
                maleAgeColumns.push({
                  index,
                  age: 100
                });
              } else if (female100PlusMatch) {
                femaleAgeColumns.push({
                  index,
                  age: 100
                });
              }
            });

            return;
          }

          if (
            !row.length ||
            row.every(
              (value) => String(value).trim() === ""
            )
          ) {
            return;
          }

          const name = cleanRegionName(row[0]);

          if (!name) {
            return;
          }

          const ageMale = Array(101).fill(0);
          const ageFemale = Array(101).fill(0);

          for (const column of maleAgeColumns) {
            ageMale[column.age] +=
              parsePopulationNumber(row[column.index]);
          }

          for (const column of femaleAgeColumns) {
            ageFemale[column.age] +=
              parsePopulationNumber(row[column.index]);
          }

          const male = ageMale.reduce(
            (sum, value) => sum + value,
            0
          );

          const female = ageFemale.reduce(
            (sum, value) => sum + value,
            0
          );

          regionMap.set(normalizeRegionName(name), {
            name,
            male,
            female,
            total: male + female,
            ageMale,
            ageFemale
          });
        });

        if (!headers) {
          throw new Error(
            "CSV 헤더를 읽지 못했습니다."
          );
        }

        if (
          maleAgeColumns.length === 0 ||
          femaleAgeColumns.length === 0
        ) {
          throw new Error(
            "남녀 연령별 인구 열을 찾지 못했습니다."
          );
        }

        regionNames = Array.from(regionMap.values())
          .map((item) => item.name)
          .sort((a, b) =>
            a.localeCompare(b, "ko-KR")
          );

        createRegionOptions();

        regionInput.disabled = false;
        searchButton.disabled = false;
        regionInput.value = DEFAULT_REGION;

        setStatus(
          `${numberFormatter.format(regionNames.length)}개 행정구역을 불러왔습니다.`
        );

        showRegion(DEFAULT_REGION);
      } catch (error) {
        console.error(error);

        regionInput.disabled = true;
        searchButton.disabled = true;
        resultElement.hidden = true;

        if (window.Plotly) {
          Plotly.purge(pyramidChart);
        }

        setStatus(
          "인구 데이터를 불러오지 못했습니다. 인터넷 연결이나 CSV 주소를 확인해 주세요.",
          true
        );
      }
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      showRegion(regionInput.value);
    });

    regionInput.addEventListener("change", () => {
      showRegion(regionInput.value);
    });

    loadPopulationData();
  </script>
</body>
</html>
