<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지역 인구 탐구 대시보드</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbf5e8;color:#3e3527;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.loading{width:min(520px,100%);padding:28px;border:1px solid #eadbb9;border-radius:24px;background:#fffdf8;box-shadow:0 22px 55px rgba(112,80,28,.12);text-align:center}.spinner{width:34px;height:34px;margin:0 auto 16px;border:4px solid #f1dfb8;border-top-color:#ad8442;border-radius:50%;animation:spin .8s linear infinite}.loading h1{margin:0;font-size:22px}.loading p{margin:10px 0 0;color:#796b54;font-size:13px;line-height:1.7}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="loader" class="loading"><div class="spinner"></div><h1>지역 인구 탐구 대시보드</h1><p>최신 화면과 인구 데이터를 불러오는 중입니다.</p></main>
  <script>
    (async () => {
      const version = "20260725-fieldwork-1";
      const response = await fetch(`./base.html?v=${version}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`기본 화면 HTTP ${response.status}`);
      let html = await response.text();

      const decoderScript = '<scr' + 'ipt>window.__decodePopulation=function(buffer){try{const text=new TextDecoder("utf-8",{fatal:true}).decode(buffer);if(/_(남|여)_\\d+세/.test(text))return text}catch(_){ }return new TextDecoder("euc-kr").decode(buffer)};</scr' + 'ipt>';
      const pakoScript = '<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></scr' + 'ipt>';
      html = html.replace("</head>", decoderScript + pakoScript + "</head>");
      html = html.replace('new TextDecoder("euc-kr").decode(await r.arrayBuffer())', 'window.__decodePopulation(await r.arrayBuffer())');

      const enhancements =
        '<scr' + `ipt src="./trend-enhancements.js?v=${version}"></scr` + 'ipt>' +
        '<scr' + `ipt src="./fieldwork-enhancements.js?v=${version}"></scr` + 'ipt>' +
        '<scr' + `ipt src="./guide-enhancements.js?v=${version}"></scr` + 'ipt>';
      html = html.replace("</body>", enhancements + "</body>");

      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      console.error(error);
      document.getElementById("loader").innerHTML = `<h1>화면을 불러오지 못했습니다.</h1><p>${error.message}<br>잠시 뒤 새로고침해 주세요.</p>`;
    });
  </script>
</body>
</html>
