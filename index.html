<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>지역별 인구 검색 + 인구 피라미드</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: #f4f6fa;
      color: #172033;
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 40px);
      letter-spacing: -0.04em;
    }

    .description {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .panel {
      padding: 24px;
      border: 1px solid #e4e7ec;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(16, 24, 40, 0.07);
    }

    .search-form {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .combo-box {
      position: relative;
      min-width: 0;
      flex: 1;
    }

    .combo-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 52px 0 16px;
      border: 1px solid #cfd4dc;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
      color: #172033;
      font-size: 16px;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #7189a7;
      box-shadow: 0 0 0 4px rgba(113, 137, 167, 0.14);
    }

    .dropdown-button {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #667085;
      font-size: 18px;
      cursor: pointer;
      transition:
        background 0.2s,
        color 0.2s;
    }

    .dropdown-button:hover {
      background: #f0f3f7;
      color: #344054;
    }

    .dropdown-button[aria-expanded="true"] {
      background: #eef2f6;
      color: #344054;
    }

    .dropdown-button[aria-expanded="true"] .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .dropdown-panel {
      position: absolute;
      z-index: 100;
      top: calc(100% + 7px);
      left: 0;
      right: 0;
      overflow: hidden;
      border: 1px solid #d8dee8;
      border-radius: 13px;
      background: #ffffff;
      box-shadow: 0 16px 38px rgba(16, 24, 40, 0.16);
    }

    .dropdown-panel[hidden] {
      display: none;
    }

    .dropdown-info {
      padding: 10px 13px;
      border-bottom: 1px solid #edf0f4;
      background: #f8fafc;
      color: #667085;
      font-size: 12px;
      line-height: 1.5;
    }

    .dropdown-list {
      max-height: 330px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 5px;
    }

    .region-option {
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #263244;
      text-align: left;
      cursor: pointer;
    }

    .region-option:hover,
    .region-option.highlighted {
      background: #edf2f7;
    }

    .region-option.selected {
      background: #e9eef4;
      font-weight: 700;
    }

    .region-option-name {
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .selected-mark {
      flex: 0 0 auto;
      color: #5e748f;
      font-size: 15px;
      font-weight: 800;
    }

    .empty-option {
      padding: 25px 15px;
      color: #7a8493;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .search-button {
      height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #586f8c;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-button:hover {
      background: #465b74;
    }

    .search-button:disabled,
    .search-input:disabled,
    .dropdown-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 24px;
      margin: 14px 2px 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .status.error {
      color: #b54747;
    }

    .result {
      margin-top: 24px;
    }

    .result[hidden] {
      display: none;
    }

    .region-title {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .period {
      margin: 0 0 16px;
      color: #667085;
      font-size: 14px;
    }

    .population-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .population-card {
      padding: 20px 16px;
      border-radius: 16px;
      background: #f7f8fb;
      text-align: center;
    }

    .population-card.total {
      background: #eef1f6;
    }

    .population-card.male {
      background: #edf2f7;
    }

    .population-card.female {
      background: #f7eff1;
    }

    .population-label {
      display: block;
      margin-bottom: 9px;
      color: #667085;
      font-size: 14px;
      font-weight: 700;
    }

    .population-value {
      display: block;
      font-size: clamp(21px, 4vw, 30px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .population-unit {
      margin-left: 2px;
      color: #667085;
      font-size: 14px;
      font-weight: 500;
    }

    .chart-card {
      padding: 20px 18px 10px;
      border: 1px solid #e3e8f0;
      border-radius: 18px;
      background: #f8fafc;
    }

    .chart-title {
      margin: 0 0 6px;
      font-size: 19px;
      letter-spacing: -0.02em;
    }

    .chart-description {
      margin: 0 0 8px;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    #pyramidChart {
      width: 100%;
      height: 680px;
    }

    @media (max-width: 768px) {
      body {
        padding: 24px 14px;
      }

      .panel {
        padding: 18px;
      }

      .search-form {
        flex-direction: column;
      }

      .combo-box,
      .search-button {
        width: 100%;
      }

      .population-grid {
        grid-template-columns: 1fr;
      }

      #pyramidChart {
        height: 760px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>지역별 인구 검색</h1>

      <p class="description">
        행정구역을 검색해 총인구·남녀 인구와 인구 피라미드를 확인하세요.
      </p>
    </header>

    <section class="panel">
      <form id="searchForm" class="search-form">
        <div
          id="comboBox"
          class="combo-box"
          role="combobox"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <div class="combo-input-wrap">
            <label for="regionInput" hidden>행정구역 검색</label>

            <input
              id="regionInput"
              class="search-input"
              type="text"
              value="서울특별시 서초구 방배3동"
              placeholder="지역을 입력하거나 목록에서 선택하세요"
              autocomplete="off"
              aria-autocomplete="list"
              aria-controls="regionDropdownList"
              disabled
            />

            <button
              id="dropdownButton"
              class="dropdown-button"
              type="button"
              aria-label="지역 목록 열기"
              aria-expanded="false"
              disabled
            >
              <span class="dropdown-arrow">▼</span>
            </button>
          </div>

          <div
            id="dropdownPanel"
            class="dropdown-panel"
            hidden
          >
            <div id="dropdownInfo" class="dropdown-info"></div>

            <div
              id="regionDropdownList"
              class="dropdown-list"
              role="listbox"
            ></div>
          </div>
        </div>

        <button
          id="searchButton"
          class="search-button"
          type="submit"
          disabled
        >
          검색
        </button>
      </form>

      <p id="status" class="status" role="status">
        인구 데이터를 불러오는 중입니다.
      </p>

      <section id="result" class="result" hidden>
        <h2 id="regionTitle" class="region-title"></h2>
        <p id="period" class="period"></p>

        <div class="population-grid">
          <article class="population-card total">
            <span class="population-label">총인구</span>

            <strong class="population-value">
              <span id="totalPopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>

          <article class="population-card male">
            <span class="population-label">남자</span>

            <strong class="population-value">
              <span id="malePopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>

          <article class="population-card female">
            <span class="population-label">여자</span>

            <strong class="population-value">
              <span id="femalePopulation">0</span>
              <span class="population-unit">명</span>
            </strong>
          </article>
        </div>

        <section class="chart-card">
          <h3 class="chart-title">인구 피라미드</h3>

          <p class="chart-description">
            연령을 5세 단위로 묶었습니다. 남자는 왼쪽, 여자는 오른쪽입니다.
          </p>

          <div id="pyramidChart"></div>
        </section>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    const CSV_URL =
      "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv";

    const DEFAULT_REGION = "서울특별시 서초구 방배3동";
    const MAX_VISIBLE_OPTIONS = 400;

    const MALE_COLOR = "#7890AC";
    const MALE_BORDER_COLOR = "#5E748F";

    const FEMALE_COLOR = "#BC8D99";
    const FEMALE_BORDER_COLOR = "#98717B";

    const searchForm = document.getElementById("searchForm");
    const comboBox = document.getElementById("comboBox");
    const regionInput = document.getElementById("regionInput");
    const dropdownButton = document.getElementById("dropdownButton");
    const dropdownPanel = document.getElementById("dropdownPanel");
    const dropdownInfo = document.getElementById("dropdownInfo");
    const dropdownList = document.getElementById("regionDropdownList");
    const searchButton = document.getElementById("searchButton");

    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");
    const regionTitle = document.getElementById("regionTitle");
    const periodElement = document.getElementById("period");
    const totalPopulation = document.getElementById("totalPopulation");
    const malePopulation = document.getElementById("malePopulation");
    const femalePopulation = document.getElementById("femalePopulation");
    const pyramidChart = document.getElementById("pyramidChart");

    const numberFormatter = new Intl.NumberFormat("ko-KR");
    const regionMap = new Map();

    let regionNames = [];
    let dataPeriod = "";
    let selectedRegionName = "";
    let visibleRegionNames = [];
    let highlightedIndex = -1;
    let dropdownIsOpen = false;

    function parseCSV(text, onRow) {
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const character = text[i];

        if (insideQuotes) {
          if (character === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i += 1;
            } else {
              insideQuotes = false;
            }
          } else {
            field += character;
          }

          continue;
        }

        if (character === '"') {
          insideQuotes = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field);
          onRow(row);

          row = [];
          field = "";
        } else if (character !== "\r") {
          field += character;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        onRow(row);
      }
    }

    function cleanRegionName(value) {
      return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\s*\(\s*\d+\s*\)\s*$/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeRegionName(value) {
      return cleanRegionName(value)
        .normalize("NFC")
        .replace(/^서울시(?=\s|$)/, "서울특별시")
        .replace(/^부산시(?=\s|$)/, "부산광역시")
        .replace(/^대구시(?=\s|$)/, "대구광역시")
        .replace(/^인천시(?=\s|$)/, "인천광역시")
        .replace(/^광주시(?=\s|$)/, "광주광역시")
        .replace(/^대전시(?=\s|$)/, "대전광역시")
        .replace(/^울산시(?=\s|$)/, "울산광역시")
        .replace(/^세종시(?=\s|$)/, "세종특별자치시")
        .replace(/^제주도(?=\s|$)/, "제주특별자치도");
    }

    function parsePopulationNumber(value) {
      const cleaned = String(value ?? "")
        .replace(/,/g, "")
        .trim();

      if (cleaned === "" || cleaned === "-") {
        return 0;
      }

      const number = Number(cleaned);

      return Number.isFinite(number) ? number : 0;
    }

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function filterRegions(query) {
      const normalizedQuery = normalizeRegionName(query)
        .toLocaleLowerCase("ko-KR");

      if (!normalizedQuery) {
        return [...regionNames];
      }

      const searchWords = normalizedQuery
        .split(/\s+/)
        .filter(Boolean);

      return regionNames.filter((name) => {
        const normalizedName = normalizeRegionName(name)
          .toLocaleLowerCase("ko-KR");

        return searchWords.every((word) =>
          normalizedName.includes(word)
        );
      });
    }

    function renderDropdown(query = "", showFullList = false) {
      let matches = showFullList
        ? [...regionNames]
        : filterRegions(query);

      if (
        showFullList &&
        selectedRegionName &&
        matches.includes(selectedRegionName)
      ) {
        matches = [
          selectedRegionName,
          ...matches.filter(
            (name) => name !== selectedRegionName
          )
        ];
      }

      const totalMatches = matches.length;

      visibleRegionNames = matches.slice(
        0,
        MAX_VISIBLE_OPTIONS
      );

      highlightedIndex = -1;
      dropdownList.replaceChildren();

      if (visibleRegionNames.length === 0) {
        const emptyMessage = document.createElement("div");
        emptyMessage.className = "empty-option";
        emptyMessage.textContent =
          "일치하는 지역이 없습니다. 다른 검색어를 입력해 주세요.";

        dropdownList.appendChild(emptyMessage);
        dropdownInfo.textContent = "검색 결과 0개";
        return;
      }

      const fragment = document.createDocumentFragment();

      visibleRegionNames.forEach((name, index) => {
        const option = document.createElement("button");

        option.type = "button";
        option.className = "region-option";
        option.dataset.index = String(index);
        option.setAttribute("role", "option");
        option.setAttribute(
          "aria-selected",
          name === selectedRegionName ? "true" : "false"
        );

        if (name === selectedRegionName) {
          option.classList.add("selected");
        }

        const optionName = document.createElement("span");
        optionName.className = "region-option-name";
        optionName.textContent = name;

        option.appendChild(optionName);

        if (name === selectedRegionName) {
          const selectedMark = document.createElement("span");
          selectedMark.className = "selected-mark";
          selectedMark.textContent = "✓";

          option.appendChild(selectedMark);
        }

        option.addEventListener("mousedown", (event) => {
          event.preventDefault();
        });

        option.addEventListener("click", () => {
          selectRegion(name);
        });

        fragment.appendChild(option);
      });

      dropdownList.appendChild(fragment);

      if (totalMatches > MAX_VISIBLE_OPTIONS) {
        dropdownInfo.textContent =
          `${numberFormatter.format(totalMatches)}개 지역 중 ` +
          `${numberFormatter.format(MAX_VISIBLE_OPTIONS)}개를 표시합니다. ` +
          "검색어를 입력하면 전체 지역에서 찾습니다.";
      } else {
        dropdownInfo.textContent =
          `${numberFormatter.format(totalMatches)}개 지역`;
      }
    }

    function openDropdown(showFullList = false) {
      if (regionInput.disabled) {
        return;
      }

      dropdownIsOpen = true;
      dropdownPanel.hidden = false;

      comboBox.setAttribute("aria-expanded", "true");
      dropdownButton.setAttribute("aria-expanded", "true");

      renderDropdown(
        showFullList ? "" : regionInput.value,
        showFullList
      );
    }

    function closeDropdown() {
      dropdownIsOpen = false;
      highlightedIndex = -1;
      dropdownPanel.hidden = true;

      comboBox.setAttribute("aria-expanded", "false");
      dropdownButton.setAttribute("aria-expanded", "false");

      regionInput.removeAttribute("aria-activedescendant");
    }

    function updateHighlightedOption() {
      const options = dropdownList.querySelectorAll(
        ".region-option"
      );

      options.forEach((option, index) => {
        option.classList.toggle(
          "highlighted",
          index === highlightedIndex
        );
      });

      const highlightedOption = options[highlightedIndex];

      if (highlightedOption) {
        highlightedOption.id = "highlightedRegionOption";

        regionInput.setAttribute(
          "aria-activedescendant",
          highlightedOption.id
        );

        highlightedOption.scrollIntoView({
          block: "nearest"
        });
      } else {
        regionInput.removeAttribute("aria-activedescendant");
      }
    }

    function selectRegion(name) {
      selectedRegionName = name;
      regionInput.value = name;

      closeDropdown();
      showRegion(name);
    }

    function findSimilarRegions(query) {
      return filterRegions(query).slice(0, 5);
    }

    function createFiveYearAgeGroups(ageValues) {
      const groups = [];

      for (
        let startAge = 0;
        startAge <= 95;
        startAge += 5
      ) {
        let groupPopulation = 0;

        for (
          let age = startAge;
          age <= startAge + 4;
          age += 1
        ) {
          groupPopulation += ageValues[age] || 0;
        }

        groups.push(groupPopulation);
      }

      groups.push(ageValues[100] || 0);

      return groups;
    }

    function createFiveYearAgeLabels() {
      const labels = [];

      for (
        let startAge = 0;
        startAge <= 95;
        startAge += 5
      ) {
        labels.push(`${startAge}~${startAge + 4}세`);
      }

      labels.push("100세 이상");

      return labels;
    }

    function buildTickValues(maxValue) {
      if (maxValue <= 0) {
        return [-1, 0, 1];
      }

      const roughStep = maxValue / 4;

      const magnitude = Math.pow(
        10,
        Math.floor(Math.log10(roughStep))
      );

      const normalized = roughStep / magnitude;

      let step;

      if (normalized <= 1) {
        step = magnitude;
      } else if (normalized <= 2) {
        step = 2 * magnitude;
      } else if (normalized <= 5) {
        step = 5 * magnitude;
      } else {
        step = 10 * magnitude;
      }

      const limit =
        Math.ceil(maxValue / step) * step;

      const tickValues = [];

      for (
        let value = -limit;
        value <= limit;
        value += step
      ) {
        tickValues.push(value);
      }

      return tickValues;
    }

    function renderPyramid(population) {
      const ageLabels =
        createFiveYearAgeLabels();

      const groupedMale =
        createFiveYearAgeGroups(population.ageMale);

      const groupedFemale =
        createFiveYearAgeGroups(population.ageFemale);

      const maleValues = groupedMale.map(
        (value) => -value
      );

      const femaleValues = [...groupedFemale];

      const maxValue = Math.max(
        ...groupedMale,
        ...groupedFemale,
        1
      );

      const tickValues =
        buildTickValues(maxValue);

      const tickTexts = tickValues.map((value) =>
        numberFormatter.format(Math.abs(value))
      );

      const maleTrace = {
        type: "bar",
        orientation: "h",
        name: "남자",
        y: ageLabels,
        x: maleValues,

        marker: {
          color: MALE_COLOR,

          line: {
            color: MALE_BORDER_COLOR,
            width: 0.6
          }
        },

        customdata: groupedMale.map((value) =>
          numberFormatter.format(value)
        ),

        hovertemplate:
          "<b>%{y}</b><br>" +
          "남자: %{customdata}명" +
          "<extra></extra>"
      };

      const femaleTrace = {
        type: "bar",
        orientation: "h",
        name: "여자",
        y: ageLabels,
        x: femaleValues,

        marker: {
          color: FEMALE_COLOR,

          line: {
            color: FEMALE_BORDER_COLOR,
            width: 0.6
          }
        },

        customdata: groupedFemale.map((value) =>
          numberFormatter.format(value)
        ),

        hovertemplate:
          "<b>%{y}</b><br>" +
          "여자: %{customdata}명" +
          "<extra></extra>"
      };

      const layout = {
        barmode: "relative",
        bargap: 0.12,

        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",

        margin: {
          t: 58,
          r: 24,
          b: 55,
          l: 92
        },

        legend: {
          orientation: "h",
          x: 0.5,
          xanchor: "center",
          y: 1.04,
          yanchor: "bottom",

          font: {
            size: 14
          }
        },

        xaxis: {
          title: {
            text: "인구(명)",
            standoff: 12
          },

          tickvals: tickValues,
          ticktext: tickTexts,

          zeroline: true,
          zerolinewidth: 1.4,
          zerolinecolor: "#7D8794",

          gridcolor: "rgba(148,163,184,0.22)",
          gridwidth: 1,

          tickfont: {
            size: 12
          },

          automargin: true,
          fixedrange: true
        },

        yaxis: {
          title: {
            text: "연령",
            standoff: 10
          },

          categoryorder: "array",
          categoryarray: ageLabels,

          tickfont: {
            size: 12
          },

          automargin: true,
          fixedrange: true
        },

        font: {
          family:
            'Pretendard, "Noto Sans KR", ' +
            '"Apple SD Gothic Neo", "Malgun Gothic", sans-serif',

          color: "#172033"
        },

        hoverlabel: {
          bgcolor: "#ffffff",
          bordercolor: "#cbd5e1",

          font: {
            color: "#172033",
            size: 13
          }
        }
      };

      Plotly.react(
        pyramidChart,
        [maleTrace, femaleTrace],
        layout,
        {
          displayModeBar: false,
          responsive: true
        }
      );
    }

    function showRegion(query) {
      const normalizedQuery =
        normalizeRegionName(query);

      const population =
        regionMap.get(normalizedQuery);

      if (!population) {
        const suggestions =
          findSimilarRegions(normalizedQuery);

        if (suggestions.length > 0) {
          setStatus(
            "정확히 일치하는 지역이 없습니다. " +
            "아래 목록에서 지역을 선택해 주세요."
          );

          openDropdown(false);
        } else {
          setStatus(
            "입력한 지역을 찾을 수 없습니다. " +
            "다른 검색어를 입력해 주세요.",
            true
          );

          openDropdown(false);
        }

        return;
      }

      selectedRegionName = population.name;
      regionInput.value = population.name;

      regionTitle.textContent = population.name;

      periodElement.textContent = dataPeriod
        ? `${dataPeriod} 주민등록 인구 기준`
        : "주민등록 인구 기준";

      totalPopulation.textContent =
        numberFormatter.format(population.total);

      malePopulation.textContent =
        numberFormatter.format(population.male);

      femalePopulation.textContent =
        numberFormatter.format(population.female);

      resultElement.hidden = false;

      setStatus(
        `${population.name}의 인구 정보를 표시했습니다.`
      );

      renderPyramid(population);
    }

    async function loadPopulationData() {
      try {
        const response = await fetch(CSV_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `CSV 요청 실패: HTTP ${response.status}`
          );
        }

        const arrayBuffer =
          await response.arrayBuffer();

        const csvText = new TextDecoder(
          "euc-kr"
        ).decode(arrayBuffer);

        let headers = null;

        const maleAgeColumns = [];
        const femaleAgeColumns = [];

        parseCSV(csvText, (row) => {
          if (!headers) {
            headers = row.map(
              (header, index) => {
                const cleanedHeader =
                  String(header ?? "").trim();

                return index === 0
                  ? cleanedHeader.replace(
                      /^\uFEFF/,
                      ""
                    )
                  : cleanedHeader;
              }
            );

            headers.forEach((header, index) => {
              const ageMatch = header.match(
                /^(\d{4}년\d{1,2}월)_(남|여)_(\d+)세(?:\s*이상)?$/
              );

              if (!ageMatch) {
                return;
              }

              if (!dataPeriod) {
                dataPeriod = ageMatch[1];
              }

              const gender = ageMatch[2];

              const age = Math.min(
                Number(ageMatch[3]),
                100
              );

              if (
                !Number.isInteger(age) ||
                age < 0 ||
                age > 100
              ) {
                return;
              }

              if (gender === "남") {
                maleAgeColumns.push({
                  index,
                  age
                });
              } else {
                femaleAgeColumns.push({
                  index,
                  age
                });
              }
            });

            return;
          }

          if (
            !row.length ||
            row.every(
              (value) =>
                String(value).trim() === ""
            )
          ) {
            return;
          }

          const name =
            cleanRegionName(row[0]);

          if (!name) {
            return;
          }

          const ageMale =
            Array(101).fill(0);

          const ageFemale =
            Array(101).fill(0);

          for (
            const column of maleAgeColumns
          ) {
            ageMale[column.age] +=
              parsePopulationNumber(
                row[column.index]
              );
          }

          for (
            const column of femaleAgeColumns
          ) {
            ageFemale[column.age] +=
              parsePopulationNumber(
                row[column.index]
              );
          }

          const male = ageMale.reduce(
            (sum, value) => sum + value,
            0
          );

          const female = ageFemale.reduce(
            (sum, value) => sum + value,
            0
          );

          regionMap.set(
            normalizeRegionName(name),
            {
              name,
              male,
              female,
              total: male + female,
              ageMale,
              ageFemale
            }
          );
        });

        if (!headers) {
          throw new Error(
            "CSV 헤더를 읽지 못했습니다."
          );
        }

        if (
          maleAgeColumns.length === 0 ||
          femaleAgeColumns.length === 0
        ) {
          throw new Error(
            "남녀 연령별 인구 열을 찾지 못했습니다."
          );
        }

        regionNames = Array.from(
          regionMap.values()
        )
          .map((item) => item.name)
          .sort((a, b) =>
            a.localeCompare(b, "ko-KR")
          );

        regionInput.disabled = false;
        dropdownButton.disabled = false;
        searchButton.disabled = false;

        regionInput.value = DEFAULT_REGION;

        const defaultPopulation =
          regionMap.get(
            normalizeRegionName(DEFAULT_REGION)
          );

        if (defaultPopulation) {
          selectRegion(
            defaultPopulation.name
          );
        } else {
          setStatus(
            `${numberFormatter.format(regionNames.length)}개 지역을 불러왔습니다. ` +
            "목록에서 지역을 선택해 주세요."
          );

          openDropdown(true);
        }
      } catch (error) {
        console.error(error);

        regionInput.disabled = true;
        dropdownButton.disabled = true;
        searchButton.disabled = true;
        resultElement.hidden = true;

        if (window.Plotly) {
          Plotly.purge(pyramidChart);
        }

        setStatus(
          "인구 데이터를 불러오지 못했습니다. " +
          "인터넷 연결이나 CSV 주소를 확인해 주세요.",
          true
        );
      }
    }

    regionInput.addEventListener("focus", () => {
      const isCurrentSelection =
        regionInput.value === selectedRegionName;

      openDropdown(isCurrentSelection);
    });

    regionInput.addEventListener("click", () => {
      const isCurrentSelection =
        regionInput.value === selectedRegionName;

      openDropdown(isCurrentSelection);
    });

    regionInput.addEventListener("input", () => {
      openDropdown(false);
    });

    regionInput.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "ArrowDown") {
          event.preventDefault();

          if (!dropdownIsOpen) {
            openDropdown(false);
          }

          if (visibleRegionNames.length > 0) {
            highlightedIndex = Math.min(
              highlightedIndex + 1,
              visibleRegionNames.length - 1
            );

            updateHighlightedOption();
          }

          return;
        }

        if (event.key === "ArrowUp") {
          event.preventDefault();

          if (!dropdownIsOpen) {
            openDropdown(false);
          }

          if (visibleRegionNames.length > 0) {
            highlightedIndex =
              highlightedIndex <= 0
                ? visibleRegionNames.length - 1
                : highlightedIndex - 1;

            updateHighlightedOption();
          }

          return;
        }

        if (event.key === "Enter") {
          if (
            dropdownIsOpen &&
            highlightedIndex >= 0 &&
            visibleRegionNames[highlightedIndex]
          ) {
            event.preventDefault();

            selectRegion(
              visibleRegionNames[
                highlightedIndex
              ]
            );
          }

          return;
        }

        if (event.key === "Escape") {
          closeDropdown();
        }
      }
    );

    dropdownButton.addEventListener(
      "click",
      () => {
        if (dropdownIsOpen) {
          closeDropdown();
        } else {
          regionInput.focus();
          openDropdown(true);
        }
      }
    );

    searchForm.addEventListener(
      "submit",
      (event) => {
        event.preventDefault();

        const normalizedQuery =
          normalizeRegionName(
            regionInput.value
          );

        const exactPopulation =
          regionMap.get(normalizedQuery);

        if (exactPopulation) {
          selectRegion(
            exactPopulation.name
          );

          return;
        }

        const matches =
          filterRegions(regionInput.value);

        if (matches.length === 1) {
          selectRegion(matches[0]);
          return;
        }

        if (matches.length > 1) {
          setStatus(
            `${numberFormatter.format(matches.length)}개 지역이 검색되었습니다. ` +
            "목록에서 하나를 선택해 주세요."
          );

          openDropdown(false);
          return;
        }

        setStatus(
          "입력한 지역을 찾을 수 없습니다. " +
          "다른 검색어를 입력해 주세요.",
          true
        );

        openDropdown(false);
      }
    );

    document.addEventListener(
      "mousedown",
      (event) => {
        if (!comboBox.contains(event.target)) {
          closeDropdown();
        }
      }
    );

    window.addEventListener("resize", () => {
      if (
        !resultElement.hidden &&
        window.Plotly
      ) {
        Plotly.Plots.resize(
          pyramidChart
        );
      }
    });

    loadPopulationData();
  </script>
</body>
</html>
