<!DOCTYPE html>
<html lang="ko" data-theme="cream">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>지역별 인구 대시보드</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root,
    :root[data-theme="cream"] {
      --page-bg: #fbf5e8;
      --page-bg-strong: #f3e4bd;
      --surface: rgba(255, 253, 248, 0.94);
      --surface-solid: #fffdf8;
      --surface-soft: #fff8e9;
      --surface-hover: #f9efd9;

      --text: #3f3729;
      --text-soft: #7e7058;
      --text-faint: #a0937d;

      --primary: #b48b46;
      --primary-hover: #947035;
      --primary-soft: #f3e4bd;

      --border: #ebddbc;
      --border-strong: #dcc89b;

      --shadow:
        0 20px 50px rgba(120, 89, 36, 0.12),
        0 4px 14px rgba(120, 89, 36, 0.05);

      --shadow-soft:
        0 10px 28px rgba(120, 89, 36, 0.09);

      --male: #7892a9;
      --male-border: #5f788f;
      --male-soft: #edf3f7;

      --female: #c69595;
      --female-border: #a87474;
      --female-soft: #faefef;

      --accent-elderly: #aa8c62;
      --accent-youth: #c49d55;

      --grid-color: rgba(126, 112, 88, 0.18);
      --zero-line: #97866c;
      --focus-ring: rgba(180, 139, 70, 0.18);
    }

    :root[data-theme="mint"] {
      --page-bg: #eef8f1;
      --page-bg-strong: #cfe8d7;
      --surface: rgba(250, 255, 252, 0.94);
      --surface-solid: #fbfffc;
      --surface-soft: #eef9f2;
      --surface-hover: #e3f3e8;

      --text: #294238;
      --text-soft: #607c70;
      --text-faint: #8ca198;

      --primary: #5f9d7a;
      --primary-hover: #477e60;
      --primary-soft: #d5ebdc;

      --border: #d4e8db;
      --border-strong: #b7d6c2;

      --shadow:
        0 20px 50px rgba(50, 106, 76, 0.12),
        0 4px 14px rgba(50, 106, 76, 0.05);

      --shadow-soft:
        0 10px 28px rgba(50, 106, 76, 0.09);

      --male: #7197a2;
      --male-border: #577984;
      --male-soft: #eaf3f5;

      --female: #bd969f;
      --female-border: #99747d;
      --female-soft: #f8eff1;

      --accent-elderly: #77957d;
      --accent-youth: #87aa83;

      --grid-color: rgba(75, 116, 94, 0.17);
      --zero-line: #718b7c;
      --focus-ring: rgba(95, 157, 122, 0.19);
    }

    :root[data-theme="berry"] {
      --page-bg: #fff1f4;
      --page-bg-strong: #f3cdd7;
      --surface: rgba(255, 251, 252, 0.94);
      --surface-solid: #fffafb;
      --surface-soft: #fff0f3;
      --surface-hover: #fbe4e9;

      --text: #4c3037;
      --text-soft: #85646c;
      --text-faint: #ad8f96;

      --primary: #b96f83;
      --primary-hover: #965568;
      --primary-soft: #f1d0d9;

      --border: #efd7dd;
      --border-strong: #dfb9c4;

      --shadow:
        0 20px 50px rgba(135, 67, 88, 0.12),
        0 4px 14px rgba(135, 67, 88, 0.05);

      --shadow-soft:
        0 10px 28px rgba(135, 67, 88, 0.09);

      --male: #7f93aa;
      --male-border: #64768b;
      --male-soft: #eef2f7;

      --female: #c28697;
      --female-border: #9f6677;
      --female-soft: #faebef;

      --accent-elderly: #a97f87;
      --accent-youth: #c08c78;

      --grid-color: rgba(133, 100, 108, 0.17);
      --zero-line: #987980;
      --focus-ring: rgba(185, 111, 131, 0.19);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 48px;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 8% 8%,
          var(--page-bg-strong) 0,
          transparent 28%
        ),
        radial-gradient(
          circle at 94% 16%,
          var(--primary-soft) 0,
          transparent 24%
        ),
        var(--page-bg);
      color: var(--text);
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .top-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .theme-switcher {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
    }

    .theme-button {
      min-height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .theme-button:hover {
      background: var(--surface-hover);
      color: var(--text);
      transform: translateY(-1px);
    }

    .theme-button[aria-pressed="true"] {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 5px 14px var(--focus-ring);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 5vw, 52px);
      border: 1px solid var(--border);
      border-radius: 32px;
      background:
        linear-gradient(
          135deg,
          var(--surface-solid) 0%,
          var(--surface-soft) 100%
        );
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      position: absolute;
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .hero::before {
      top: -90px;
      right: -70px;
      width: 260px;
      height: 260px;
      background: var(--primary-soft);
      opacity: 0.62;
    }

    .hero::after {
      bottom: -100px;
      left: -80px;
      width: 230px;
      height: 230px;
      background: var(--page-bg-strong);
      opacity: 0.48;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--primary-hover);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px var(--focus-ring);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    .hero-description {
      max-width: 660px;
      margin: 16px 0 0;
      color: var(--text-soft);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.7;
      letter-spacing: -0.015em;
    }

    .search-area {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-top: 30px;
    }

    .combo-box {
      position: relative;
      min-width: 0;
    }

    .combo-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      z-index: 1;
      color: var(--text-faint);
      font-size: 18px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 58px;
      padding: 0 54px 0 48px;
      border: 1px solid var(--border-strong);
      border-radius: 17px;
      outline: none;
      background: var(--surface-solid);
      color: var(--text);
      font-size: 16px;
      font-weight: 650;
      box-shadow: 0 6px 16px rgba(60, 45, 20, 0.04);
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-faint);
      font-weight: 500;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 5px var(--focus-ring);
    }

    .dropdown-button {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--text-soft);
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .dropdown-button:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .dropdown-arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .dropdown-button[aria-expanded="true"] .dropdown-arrow {
      transform: rotate(180deg);
    }

    .search-button {
      height: 58px;
      padding: 0 27px;
      border: 0;
      border-radius: 17px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 10px 24px var(--focus-ring);
      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .search-button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 13px 28px var(--focus-ring);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .search-button:disabled,
    .search-input:disabled,
    .dropdown-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .dropdown-panel {
      position: absolute;
      z-index: 300;
      top: calc(100% + 9px);
      left: 0;
      right: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface-solid);
      box-shadow: var(--shadow);
    }

    .dropdown-panel[hidden] {
      display: none;
    }

    .dropdown-info {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .dropdown-list {
      max-height: 350px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      scrollbar-color: var(--border-strong) transparent;
      scrollbar-width: thin;
    }

    .region-option {
      display: flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        background 0.16s ease,
        color 0.16s ease;
    }

    .region-option:hover,
    .region-option.highlighted {
      background: var(--surface-hover);
    }

    .region-option.selected {
      background: var(--primary-soft);
      color: var(--primary-hover);
      font-weight: 800;
    }

    .region-option-name {
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .selected-mark {
      flex: 0 0 auto;
      color: var(--primary);
      font-size: 16px;
      font-weight: 900;
    }

    .empty-option {
      padding: 28px 16px;
      color: var(--text-soft);
      text-align: center;
      font-size: 14px;
      line-height: 1.65;
    }

    .status {
      position: relative;
      z-index: 1;
      min-height: 23px;
      margin: 13px 3px 0;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
    }

    .status.error {
      color: #a85656;
    }

    .dashboard {
      margin-top: 22px;
    }

    .dashboard[hidden] {
      display: none;
    }

    .dashboard-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 16px;
    }

    .region-title {
      margin: 0;
      font-size: clamp(23px, 4vw, 32px);
      letter-spacing: -0.04em;
    }

    .period {
      margin: 7px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 650;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card {
      position: relative;
      overflow: hidden;
      min-height: 164px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .metric-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow);
    }

    .metric-card::after {
      position: absolute;
      right: -38px;
      bottom: -48px;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: var(--card-accent, var(--primary-soft));
      opacity: 0.48;
      content: "";
      pointer-events: none;
    }

    .metric-card.total {
      --card-accent: var(--primary-soft);
    }

    .metric-card.gender {
      --card-accent: var(--male-soft);
    }

    .metric-card.elderly {
      --card-accent: var(--page-bg-strong);
    }

    .metric-card.youth {
      --card-accent: var(--primary-soft);
    }

    .metric-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .metric-label {
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .metric-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-solid);
      font-size: 19px;
      box-shadow: 0 5px 14px rgba(60, 45, 20, 0.05);
    }

    .metric-value {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 17px;
      font-size: clamp(26px, 3.6vw, 37px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.055em;
    }

    .metric-unit {
      margin-left: 3px;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .metric-detail {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.55;
    }

    .gender-values {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .gender-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 9px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 800;
    }

    .gender-row.male {
      background: var(--male-soft);
      color: var(--male-border);
    }

    .gender-row.female {
      background: var(--female-soft);
      color: var(--female-border);
    }

    .gender-count {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
    }

    .chart-section {
      margin-top: 16px;
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid var(--border);
      border-radius: 27px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .chart-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 4px;
    }

    .chart-title {
      margin: 0;
      font-size: clamp(20px, 3vw, 27px);
      letter-spacing: -0.04em;
    }

    .chart-description {
      margin: 8px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.6;
    }

    .chart-legend-note {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    #pyramidChart {
      width: 100%;
      height: 700px;
    }

    @media (max-width: 980px) {
      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 16px 12px 34px;
      }

      .top-toolbar {
        justify-content: center;
      }

      .theme-switcher {
        width: 100%;
      }

      .theme-button {
        flex: 1;
        padding: 0 8px;
      }

      .hero {
        padding: 28px 18px;
        border-radius: 25px;
      }

      .hero-description {
        font-size: 15px;
      }

      .search-area {
        grid-template-columns: 1fr;
      }

      .search-button {
        width: 100%;
      }

      .dashboard-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .chart-header {
        flex-direction: column;
        gap: 8px;
      }

      .chart-legend-note {
        white-space: normal;
      }

      #pyramidChart {
        height: 760px;
      }
    }

    @media (max-width: 520px) {
      .metric-grid {
        grid-template-columns: 1fr;
      }

      .metric-card {
        min-height: 150px;
      }

      .metric-value {
        font-size: 34px;
      }

      .chart-section {
        padding: 18px 10px 10px;
        border-radius: 22px;
      }

      #pyramidChart {
        height: 800px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <div class="top-toolbar">
      <div class="theme-switcher" aria-label="색상 테마 선택">
        <button
          class="theme-button"
          type="button"
          data-theme-value="cream"
          aria-pressed="true"
        >
          🍞 크림
        </button>

        <button
          class="theme-button"
          type="button"
          data-theme-value="mint"
          aria-pressed="false"
        >
          🌿 민트
        </button>

        <button
          class="theme-button"
          type="button"
          data-theme-value="berry"
          aria-pressed="false"
        >
          🍓 베리
        </button>
      </div>
    </div>

    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          주민등록 인구 데이터
        </div>

        <h1>지역별 인구 대시보드</h1>

        <p class="hero-description">
          원하는 행정구역을 검색해 총인구와 성별 인구, 연령 구조를
          한눈에 확인해 보세요.
        </p>

        <form id="searchForm" class="search-area">
          <div
            id="comboBox"
            class="combo-box"
            role="combobox"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <div class="combo-input-wrap">
              <span class="search-icon" aria-hidden="true">⌕</span>

              <label for="regionInput" hidden>
                행정구역 검색
              </label>

              <input
                id="regionInput"
                class="search-input"
                type="text"
                value="서울특별시 서초구 방배3동"
                placeholder="지역을 입력하거나 목록에서 선택하세요"
                autocomplete="off"
                aria-autocomplete="list"
                aria-controls="regionDropdownList"
                disabled
              />

              <button
                id="dropdownButton"
                class="dropdown-button"
                type="button"
                aria-label="지역 목록 열기"
                aria-expanded="false"
                disabled
              >
                <span class="dropdown-arrow">▼</span>
              </button>
            </div>

            <div
              id="dropdownPanel"
              class="dropdown-panel"
              hidden
            >
              <div
                id="dropdownInfo"
                class="dropdown-info"
              ></div>

              <div
                id="regionDropdownList"
                class="dropdown-list"
                role="listbox"
              ></div>
            </div>
          </div>

          <button
            id="searchButton"
            class="search-button"
            type="submit"
            disabled
          >
            지역 확인
          </button>
        </form>

        <p id="status" class="status" role="status">
          인구 데이터를 불러오는 중입니다.
        </p>
      </div>
    </section>

  <script>
    "use strict";

    const CSV_URL =
      "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv";

    const DEFAULT_REGION =
      "서울특별시 서초구 방배3동";

    const MAX_VISIBLE_OPTIONS = 400;

    const searchForm =
      document.getElementById("searchForm");

    const comboBox =
      document.getElementById("comboBox");

    const regionInput =
      document.getElementById("regionInput");

    const dropdownButton =
      document.getElementById("dropdownButton");

    const dropdownPanel =
      document.getElementById("dropdownPanel");

    const dropdownInfo =
      document.getElementById("dropdownInfo");

    const dropdownList =
      document.getElementById("regionDropdownList");

    const searchButton =
      document.getElementById("searchButton");

    const statusElement =
      document.getElementById("status");

    const dashboard =
      document.getElementById("dashboard");

    const regionTitle =
      document.getElementById("regionTitle");

    const periodElement =
      document.getElementById("period");

    const totalPopulation =
      document.getElementById("totalPopulation");

    const malePopulation =
      document.getElementById("malePopulation");

    const femalePopulation =
      document.getElementById("femalePopulation");

    const elderlyRate =
      document.getElementById("elderlyRate");

    const elderlyPopulation =
      document.getElementById("elderlyPopulation");

    const youthRate =
      document.getElementById("youthRate");

    const youthPopulation =
      document.getElementById("youthPopulation");

    const pyramidChart =
      document.getElementById("pyramidChart");

    const themeButtons =
      document.querySelectorAll(".theme-button");

    const numberFormatter =
      new Intl.NumberFormat("ko-KR");

    const rateFormatter =
      new Intl.NumberFormat("ko-KR", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      });

    const regionMap = new Map();

    let regionNames = [];
    let dataPeriod = "";
    let selectedRegionName = "";
    let visibleRegionNames = [];
    let highlightedIndex = -1;
    let dropdownIsOpen = false;

    function parseCSV(text, onRow) {
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];

        if (insideQuotes) {
          if (character === '"') {
            if (text[index + 1] === '"') {
              field += '"';
              index += 1;
            } else {
              insideQuotes = false;
            }
          } else {
            field += character;
          }

          continue;
        }

        if (character === '"') {
          insideQuotes = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field);
          onRow(row);

          row = [];
          field = "";
        } else if (character !== "\r") {
          field += character;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        onRow(row);
      }
    }

    function cleanRegionName(value) {
      return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\s*\(\s*\d+\s*\)\s*$/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeRegionName(value) {
      return cleanRegionName(value)
        .normalize("NFC")
        .replace(/^서울시(?=\s|$)/, "서울특별시")
        .replace(/^부산시(?=\s|$)/, "부산광역시")
        .replace(/^대구시(?=\s|$)/, "대구광역시")
        .replace(/^인천시(?=\s|$)/, "인천광역시")
        .replace(/^광주시(?=\s|$)/, "광주광역시")
        .replace(/^대전시(?=\s|$)/, "대전광역시")
        .replace(/^울산시(?=\s|$)/, "울산광역시")
        .replace(/^세종시(?=\s|$)/, "세종특별자치시")
        .replace(/^제주도(?=\s|$)/, "제주특별자치도");
    }

    function parsePopulationNumber(value) {
      const cleaned = String(value ?? "")
        .replace(/,/g, "")
        .trim();

      if (cleaned === "" || cleaned === "-") {
        return 0;
      }

      const number = Number(cleaned);

      return Number.isFinite(number)
        ? number
        : 0;
    }

    function sumAgeRange(values, startAge, endAge) {
      let total = 0;

      for (
        let age = startAge;
        age <= endAge;
        age += 1
      ) {
        total += values[age] || 0;
      }

      return total;
    }

    function calculateRate(part, total) {
      if (!total) {
        return 0;
      }

      return (part / total) * 100;
    }

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle(
        "error",
        isError
      );
    }

    function getCssVariable(name) {
      return getComputedStyle(
        document.documentElement
      )
        .getPropertyValue(name)
        .trim();
    }

    function applyTheme(themeName) {
      document.documentElement.dataset.theme =
        themeName;

      themeButtons.forEach((button) => {
        const isSelected =
          button.dataset.themeValue === themeName;

        button.setAttribute(
          "aria-pressed",
          String(isSelected)
        );
      });

      try {
        localStorage.setItem(
          "population-dashboard-theme",
          themeName
        );
      } catch (error) {
        console.warn(
          "테마 설정을 저장하지 못했습니다.",
          error
        );
      }

      if (
        selectedRegionName &&
        !dashboard.hidden
      ) {
        const population =
          regionMap.get(
            normalizeRegionName(
              selectedRegionName
            )
          );

        if (population) {
          renderPyramid(population);
        }
      }
    }

    function initializeTheme() {
      let savedTheme = "cream";

      try {
        const storedTheme =
          localStorage.getItem(
            "population-dashboard-theme"
          );

        if (
          ["cream", "mint", "berry"].includes(
            storedTheme
          )
        ) {
          savedTheme = storedTheme;
        }
      } catch (error) {
        console.warn(
          "저장된 테마를 읽지 못했습니다.",
          error
        );
      }

      applyTheme(savedTheme);
    }

    function filterRegions(query) {
      const normalizedQuery =
        normalizeRegionName(query)
          .toLocaleLowerCase("ko-KR");

      if (!normalizedQuery) {
        return [...regionNames];
      }

      const searchWords =
        normalizedQuery
          .split(/\s+/)
          .filter(Boolean);

      return regionNames.filter((name) => {
        const normalizedName =
          normalizeRegionName(name)
            .toLocaleLowerCase("ko-KR");

        return searchWords.every((word) =>
          normalizedName.includes(word)
        );
      });
    }

    function renderDropdown(
      query = "",
      showFullList = false
    ) {
      let matches = showFullList
        ? [...regionNames]
        : filterRegions(query);

      if (
        showFullList &&
        selectedRegionName &&
        matches.includes(selectedRegionName)
      ) {
        matches = [
          selectedRegionName,
          ...matches.filter(
            (name) =>
              name !== selectedRegionName
          )
        ];
      }

      const totalMatches = matches.length;

      visibleRegionNames =
        matches.slice(
          0,
          MAX_VISIBLE_OPTIONS
        );

      highlightedIndex = -1;
      dropdownList.replaceChildren();

      if (visibleRegionNames.length === 0) {
        const emptyMessage =
          document.createElement("div");

        emptyMessage.className =
          "empty-option";

        emptyMessage.textContent =
          "일치하는 지역이 없습니다. 다른 검색어를 입력해 주세요.";

        dropdownList.appendChild(
          emptyMessage
        );

        dropdownInfo.textContent =
          "검색 결과 0개";

        return;
      }

      const fragment =
        document.createDocumentFragment();

      visibleRegionNames.forEach(
        (name, index) => {
          const option =
            document.createElement("button");

          option.type = "button";
          option.className =
            "region-option";

          option.dataset.index =
            String(index);

          option.setAttribute(
            "role",
            "option"
          );

          option.setAttribute(
            "aria-selected",
            name === selectedRegionName
              ? "true"
              : "false"
          );

          if (name === selectedRegionName) {
            option.classList.add(
              "selected"
            );
          }

          const optionName =
            document.createElement("span");

          optionName.className =
            "region-option-name";

          optionName.textContent = name;

          option.appendChild(optionName);

          if (name === selectedRegionName) {
            const selectedMark =
              document.createElement("span");

            selectedMark.className =
              "selected-mark";

            selectedMark.textContent = "✓";

            option.appendChild(
              selectedMark
            );
          }

          option.addEventListener(
            "mousedown",
            (event) => {
              event.preventDefault();
            }
          );

          option.addEventListener(
            "click",
            () => {
              selectRegion(name);
            }
          );

          fragment.appendChild(option);
        }
      );

      dropdownList.appendChild(fragment);

      if (
        totalMatches >
        MAX_VISIBLE_OPTIONS
      ) {
        dropdownInfo.textContent =
          `${numberFormatter.format(totalMatches)}개 지역 중 ` +
          `${numberFormatter.format(MAX_VISIBLE_OPTIONS)}개를 표시합니다. ` +
          "검색어를 입력하면 전체 지역에서 찾습니다.";
      } else {
        dropdownInfo.textContent =
          `${numberFormatter.format(totalMatches)}개 지역`;
      }
    }

    function openDropdown(
      showFullList = false
    ) {
      if (regionInput.disabled) {
        return;
      }

      dropdownIsOpen = true;
      dropdownPanel.hidden = false;

      comboBox.setAttribute(
        "aria-expanded",
        "true"
      );

      dropdownButton.setAttribute(
        "aria-expanded",
        "true"
      );

      renderDropdown(
        showFullList
          ? ""
          : regionInput.value,
        showFullList
      );
    }

    function closeDropdown() {
      dropdownIsOpen = false;
      highlightedIndex = -1;
      dropdownPanel.hidden = true;

      comboBox.setAttribute(
        "aria-expanded",
        "false"
      );

      dropdownButton.setAttribute(
        "aria-expanded",
        "false"
      );

      regionInput.removeAttribute(
        "aria-activedescendant"
      );
    }

    function updateHighlightedOption() {
      const options =
        dropdownList.querySelectorAll(
          ".region-option"
        );

      options.forEach((option, index) => {
        option.classList.toggle(
          "highlighted",
          index === highlightedIndex
        );

        if (
          index !== highlightedIndex
        ) {
          option.removeAttribute("id");
        }
      });

      const highlightedOption =
        options[highlightedIndex];

      if (highlightedOption) {
        highlightedOption.id =
          "highlightedRegionOption";

        regionInput.setAttribute(
          "aria-activedescendant",
          highlightedOption.id
        );

        highlightedOption.scrollIntoView({
          block: "nearest"
        });
      } else {
        regionInput.removeAttribute(
          "aria-activedescendant"
        );
      }
    }

    function selectRegion(name) {
      selectedRegionName = name;
      regionInput.value = name;

      closeDropdown();
      showRegion(name);
    }

    function createFiveYearAgeGroups(
      ageValues
    ) {
      const groups = [];

      for (
        let startAge = 0;
        startAge <= 95;
        startAge += 5
      ) {
        groups.push(
          sumAgeRange(
            ageValues,
            startAge,
            startAge + 4
          )
        );
      }

      groups.push(ageValues[100] || 0);

      return groups;
    }

    function createFiveYearAgeLabels() {
      const labels = [];

      for (
        let startAge = 0;
        startAge <= 95;
        startAge += 5
      ) {
        labels.push(
          `${startAge}~${startAge + 4}세`
        );
      }

      labels.push("100세 이상");

      return labels;
    }

    function buildTickValues(maxValue) {
      if (maxValue <= 0) {
        return [-1, 0, 1];
      }

      const roughStep =
        maxValue / 4;

      const magnitude = Math.pow(
        10,
        Math.floor(
          Math.log10(roughStep)
        )
      );

      const normalized =
        roughStep / magnitude;

      let step;

      if (normalized <= 1) {
        step = magnitude;
      } else if (normalized <= 2) {
        step = 2 * magnitude;
      } else if (normalized <= 5) {
        step = 5 * magnitude;
      } else {
        step = 10 * magnitude;
      }

      const limit =
        Math.ceil(maxValue / step) *
        step;

      const tickValues = [];

      for (
        let value = -limit;
        value <= limit;
        value += step
      ) {
        tickValues.push(value);
      }

      return tickValues;
    }

    function renderPyramid(population) {
      const ageLabels =
        createFiveYearAgeLabels();

      const groupedMale =
        createFiveYearAgeGroups(
          population.ageMale
        );

      const groupedFemale =
        createFiveYearAgeGroups(
          population.ageFemale
        );

      const maleValues =
        groupedMale.map(
          (value) => -value
        );

      const femaleValues =
        [...groupedFemale];

      const maxValue = Math.max(
        ...groupedMale,
        ...groupedFemale,
        1
      );

      const tickValues =
        buildTickValues(maxValue);

      const tickTexts =
        tickValues.map((value) =>
          numberFormatter.format(
            Math.abs(value)
          )
        );

      const axisLimit = Math.max(
        ...tickValues.map((value) =>
          Math.abs(value)
        ),
        1
      );

      const textColor =
        getCssVariable("--text");

      const textSoft =
        getCssVariable("--text-soft");

      const maleColor =
        getCssVariable("--male");

      const maleBorder =
        getCssVariable("--male-border");

      const femaleColor =
        getCssVariable("--female");

      const femaleBorder =
        getCssVariable("--female-border");

      const gridColor =
        getCssVariable("--grid-color");

      const zeroLine =
        getCssVariable("--zero-line");

      const surfaceSolid =
        getCssVariable("--surface-solid");

      const borderColor =
        getCssVariable("--border-strong");

      const maleTrace = {
        type: "bar",
        orientation: "h",
        name: "남자",
        y: ageLabels,
        x: maleValues,

        marker: {
          color: maleColor,
          line: {
            color: maleBorder,
            width: 0.7
          }
        },

        customdata:
          groupedMale.map((value) =>
            numberFormatter.format(value)
          ),

        hovertemplate:
          "<b>%{y}</b><br>" +
          "남자: %{customdata}명" +
          "<extra></extra>"
      };

      const femaleTrace = {
        type: "bar",
        orientation: "h",
        name: "여자",
        y: ageLabels,
        x: femaleValues,

        marker: {
          color: femaleColor,
          line: {
            color: femaleBorder,
            width: 0.7
          }
        },

        customdata:
          groupedFemale.map((value) =>
            numberFormatter.format(value)
          ),

        hovertemplate:
          "<b>%{y}</b><br>" +
          "여자: %{customdata}명" +
          "<extra></extra>"
      };

      const layout = {
        barmode: "relative",
        bargap: 0.13,

        paper_bgcolor:
          "rgba(0,0,0,0)",

        plot_bgcolor:
          "rgba(0,0,0,0)",

        margin: {
          t: 64,
          r: 30,
          b: 60,
          l: 95
        },

        legend: {
          orientation: "h",
          x: 0.5,
          xanchor: "center",
          y: 1.04,
          yanchor: "bottom",

          font: {
            size: 14,
            color: textColor
          }
        },

        xaxis: {
          title: {
            text: "인구(명)",
            standoff: 13,

            font: {
              color: textSoft
            }
          },

          range: [
            -axisLimit,
            axisLimit
          ],

          tickvals: tickValues,
          ticktext: tickTexts,

          zeroline: true,
          zerolinewidth: 1.5,
          zerolinecolor: zeroLine,

          gridcolor: gridColor,
          gridwidth: 1,

          tickfont: {
            size: 12,
            color: textSoft
          },

          automargin: true,
          fixedrange: true
        },

        yaxis: {
          title: {
            text: "연령",
            standoff: 10,

            font: {
              color: textSoft
            }
          },

          categoryorder: "array",
          categoryarray: ageLabels,

          tickfont: {
            size: 12,
            color: textSoft
          },

          automargin: true,
          fixedrange: true
        },

        font: {
          family:
            'Pretendard, "Noto Sans KR", ' +
            '"Apple SD Gothic Neo", "Malgun Gothic", sans-serif',

          color: textColor
        },

        hoverlabel: {
          bgcolor: surfaceSolid,
          bordercolor: borderColor,

          font: {
            color: textColor,
            size: 13
          }
        }
      };

      Plotly.react(
        pyramidChart,
        [maleTrace, femaleTrace],
        layout,
        {
          displayModeBar: false,
          responsive: true
        }
      );
    }

    function showRegion(query) {
      const normalizedQuery =
        normalizeRegionName(query);

      const population =
        regionMap.get(normalizedQuery);

      if (!population) {
        const matches =
          filterRegions(normalizedQuery);

        if (matches.length > 0) {
          setStatus(
            `${numberFormatter.format(matches.length)}개 관련 지역이 있습니다. ` +
            "목록에서 하나를 선택해 주세요."
          );
        } else {
          setStatus(
            "입력한 지역을 찾을 수 없습니다. 다른 검색어를 입력해 주세요.",
            true
          );
        }

        openDropdown(false);
        return;
      }

      selectedRegionName =
        population.name;

      regionInput.value =
        population.name;

      const elderlyMale =
        sumAgeRange(
          population.ageMale,
          65,
          100
        );

      const elderlyFemale =
        sumAgeRange(
          population.ageFemale,
          65,
          100
        );

      const elderlyTotal =
        elderlyMale +
        elderlyFemale;

      const youthMale =
        sumAgeRange(
          population.ageMale,
          0,
          14
        );

      const youthFemale =
        sumAgeRange(
          population.ageFemale,
          0,
          14
        );

      const youthTotal =
        youthMale +
        youthFemale;

      const elderlyPercent =
        calculateRate(
          elderlyTotal,
          population.total
        );

      const youthPercent =
        calculateRate(
          youthTotal,
          population.total
        );

      regionTitle.textContent =
        population.name;

      periodElement.textContent =
        dataPeriod
          ? `${dataPeriod} 주민등록 인구 기준`
          : "주민등록 인구 기준";

      totalPopulation.textContent =
        numberFormatter.format(
          population.total
        );

      malePopulation.textContent =
        numberFormatter.format(
          population.male
        );

      femalePopulation.textContent =
        numberFormatter.format(
          population.female
        );

      elderlyRate.textContent =
        rateFormatter.format(
          elderlyPercent
        );

      elderlyPopulation.textContent =
        numberFormatter.format(
          elderlyTotal
        );

      youthRate.textContent =
        rateFormatter.format(
          youthPercent
        );

      youthPopulation.textContent =
        numberFormatter.format(
          youthTotal
        );

      dashboard.hidden = false;

      setStatus(
        `${population.name}의 인구 정보를 표시했습니다.`
      );

      renderPyramid(population);
    }

    async function loadPopulationData() {
      try {
        const response = await fetch(
          CSV_URL,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `CSV 요청 실패: HTTP ${response.status}`
          );
        }

        const arrayBuffer =
          await response.arrayBuffer();

        const csvText =
          new TextDecoder(
            "euc-kr"
          ).decode(arrayBuffer);

        let headers = null;

        const maleAgeColumns = [];
        const femaleAgeColumns = [];

        parseCSV(csvText, (row) => {
          if (!headers) {
            headers = row.map(
              (header, index) => {
                const cleanedHeader =
                  String(
                    header ?? ""
                  ).trim();

                return index === 0
                  ? cleanedHeader.replace(
                      /^\uFEFF/,
                      ""
                    )
                  : cleanedHeader;
              }
            );

            headers.forEach(
              (header, index) => {
                const ageMatch =
                  header.match(
                    /^(\d{4}년\d{1,2}월)_(남|여)_(\d+)세(?:\s*이상)?$/
                  );

                if (!ageMatch) {
                  return;
                }

                if (!dataPeriod) {
                  dataPeriod =
                    ageMatch[1];
                }

                const gender =
                  ageMatch[2];

                const age = Math.min(
                  Number(ageMatch[3]),
                  100
                );

                if (
                  !Number.isInteger(age) ||
                  age < 0 ||
                  age > 100
                ) {
                  return;
                }

                if (gender === "남") {
                  maleAgeColumns.push({
                    index,
                    age
                  });
                } else {
                  femaleAgeColumns.push({
                    index,
                    age
                  });
                }
              }
            );

            return;
          }

          if (
            !row.length ||
            row.every(
              (value) =>
                String(value).trim() === ""
            )
          ) {
            return;
          }

          const name =
            cleanRegionName(row[0]);

          if (!name) {
            return;
          }

          const ageMale =
            Array(101).fill(0);

          const ageFemale =
            Array(101).fill(0);

          for (
            const column of
            maleAgeColumns
          ) {
            ageMale[column.age] +=
              parsePopulationNumber(
                row[column.index]
              );
          }

          for (
            const column of
            femaleAgeColumns
          ) {
            ageFemale[column.age] +=
              parsePopulationNumber(
                row[column.index]
              );
          }

          const male =
            ageMale.reduce(
              (sum, value) =>
                sum + value,
              0
            );

          const female =
            ageFemale.reduce(
              (sum, value) =>
                sum + value,
              0
            );

          regionMap.set(
            normalizeRegionName(name),
            {
              name,
              male,
              female,
              total: male + female,
              ageMale,
              ageFemale
            }
          );
        });

        if (!headers) {
          throw new Error(
            "CSV 헤더를 읽지 못했습니다."
          );
        }

        if (
          maleAgeColumns.length === 0 ||
          femaleAgeColumns.length === 0
        ) {
          throw new Error(
            "남녀 연령별 인구 열을 찾지 못했습니다."
          );
        }

        regionNames =
          Array.from(
            regionMap.values()
          )
            .map(
              (item) => item.name
            )
            .sort((a, b) =>
              a.localeCompare(
                b,
                "ko-KR"
              )
            );

        regionInput.disabled = false;
        dropdownButton.disabled = false;
        searchButton.disabled = false;

        regionInput.value =
          DEFAULT_REGION;

        const defaultPopulation =
          regionMap.get(
            normalizeRegionName(
              DEFAULT_REGION
            )
          );

        if (defaultPopulation) {
          selectRegion(
            defaultPopulation.name
          );
        } else {
          setStatus(
            `${numberFormatter.format(regionNames.length)}개 지역을 불러왔습니다. ` +
            "목록에서 지역을 선택해 주세요."
          );

          openDropdown(true);
        }
      } catch (error) {
        console.error(error);

        regionInput.disabled = true;
        dropdownButton.disabled = true;
        searchButton.disabled = true;
        dashboard.hidden = true;

        if (window.Plotly) {
          Plotly.purge(
            pyramidChart
          );
        }

        setStatus(
          "인구 데이터를 불러오지 못했습니다. 인터넷 연결이나 CSV 주소를 확인해 주세요.",
          true
        );
      }
    }

    themeButtons.forEach((button) => {
      button.addEventListener(
        "click",
        () => {
          applyTheme(
            button.dataset.themeValue
          );
        }
      );
    });

    regionInput.addEventListener(
      "focus",
      () => {
        const isCurrentSelection =
          regionInput.value ===
          selectedRegionName;

        openDropdown(
          isCurrentSelection
        );
      }
    );

    regionInput.addEventListener(
      "click",
      () => {
        const isCurrentSelection =
          regionInput.value ===
          selectedRegionName;

        openDropdown(
          isCurrentSelection
        );
      }
    );

    regionInput.addEventListener(
      "input",
      () => {
        openDropdown(false);
      }
    );

    regionInput.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "ArrowDown"
        ) {
          event.preventDefault();

          if (!dropdownIsOpen) {
            openDropdown(false);
          }

          if (
            visibleRegionNames.length > 0
          ) {
            highlightedIndex =
              Math.min(
                highlightedIndex + 1,
                visibleRegionNames.length - 1
              );

            updateHighlightedOption();
          }

          return;
        }

        if (
          event.key === "ArrowUp"
        ) {
          event.preventDefault();

          if (!dropdownIsOpen) {
            openDropdown(false);
          }

          if (
            visibleRegionNames.length > 0
          ) {
            highlightedIndex =
              highlightedIndex <= 0
                ? visibleRegionNames.length - 1
                : highlightedIndex - 1;

            updateHighlightedOption();
          }

          return;
        }

        if (event.key === "Enter") {
          if (
            dropdownIsOpen &&
            highlightedIndex >= 0 &&
            visibleRegionNames[
              highlightedIndex
            ]
          ) {
            event.preventDefault();

            selectRegion(
              visibleRegionNames[
                highlightedIndex
              ]
            );
          }

          return;
        }

        if (event.key === "Escape") {
          closeDropdown();
        }
      }
    );

    dropdownButton.addEventListener(
      "click",
      () => {
        if (dropdownIsOpen) {
          closeDropdown();
        } else {
          regionInput.focus();
          openDropdown(true);
        }
      }
    );

    searchForm.addEventListener(
      "submit",
      (event) => {
        event.preventDefault();

        const normalizedQuery =
          normalizeRegionName(
            regionInput.value
          );

        const exactPopulation =
          regionMap.get(
            normalizedQuery
          );

        if (exactPopulation) {
          selectRegion(
            exactPopulation.name
          );

          return;
        }

        const matches =
          filterRegions(
            regionInput.value
          );

        if (matches.length === 1) {
          selectRegion(matches[0]);
          return;
        }

        if (matches.length > 1) {
          setStatus(
            `${numberFormatter.format(matches.length)}개 지역이 검색되었습니다. ` +
            "목록에서 하나를 선택해 주세요."
          );

          openDropdown(false);
          return;
        }

        setStatus(
          "입력한 지역을 찾을 수 없습니다. 다른 검색어를 입력해 주세요.",
          true
        );

        openDropdown(false);
      }
    );

    document.addEventListener(
      "mousedown",
      (event) => {
        if (
          !comboBox.contains(
            event.target
          )
        ) {
          closeDropdown();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        if (
          !dashboard.hidden &&
          window.Plotly
        ) {
          Plotly.Plots.resize(
            pyramidChart
          );
        }
      }
    );

    initializeTheme();
    loadPopulationData();
  </script>
</body>
</html>
